# Scenarios `tgd serve` is expected to fail under a 2026-07-28 client (D-319). The suite
# fails on any other failure and on a listed scenario that passes. Each failing or warning
# check is listed exactly in 2026-07-28.checks, which the workflow also gates.
server:
