# cargo-deny configuration (docs/06-engineering/quality-bar.md, "deny").
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
# tzf-rs's data crate is ODbL. It is a benchmark rival in spike S2 only (publish = false) and
# never ships or feeds a pack. Any new use needs its own decision (ADR-0030).
# webpki-roots is Mozilla's CA root bundle (CDLA-Permissive-2.0, a permissive data licence):
# the roots the `teigeodata-sync` feature `http` verifies TLS with (D-168, D-279), and the
# forge's HTTPS client's. It ships in binaries with that feature: their third-party notices
# carry the CDLA-Permissive-2.0 text, as the licence asks of shared data.
exceptions = [
  { crate = "tzf-dist", allow = ["ODbL-1.0"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
