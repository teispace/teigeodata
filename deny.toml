# cargo-deny configuration (docs/06-engineering/quality-bar.md, "deny").
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every crate, not only workspace members: the scope CI's cargo-deny applies (D-367).
unmaintained = "all"
# Each ignore names its decision and when to look again.
ignore = [
  # chrono is unmaintained (no vulnerability, no fixed version). It comes only through rmcp and
  # schemars (the MCP server) and arrow/parquet (the forge); every rmcp release requires it.
  # D-367: review when rmcp or arrow moves to jiff or time, and at each dependency update.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, transitive via rmcp and arrow; D-367" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
# tzf-rs's data crate is ODbL. It is a benchmark rival in spike S2 only (publish = false) and
# never ships or feeds a pack. Any new use needs its own decision (ADR-0030).
# webpki-roots is Mozilla's CA root bundle (CDLA-Permissive-2.0, a permissive data licence):
# the roots the `teigeodata-sync` feature `http` verifies TLS with (D-168, D-279), and the
# forge's HTTPS client's. It ships in binaries with that feature: their third-party notices
# carry the CDLA-Permissive-2.0 text, as the licence asks of shared data.
exceptions = [
  { crate = "tzf-dist", allow = ["ODbL-1.0"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
