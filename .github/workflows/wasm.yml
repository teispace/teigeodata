# The WebAssembly packages (phase 5.7, D-293): each variant (a set of components, D-291) built
# by `cargo xtask package-wasm`, its module held to its budget, and the parity checks run from
# the built package on Node.js (every supported line), Bun, Deno, Chromium, Firefox, WebKit
# and workerd; and the Dart package's web layer on the full package, compiled by dart2js and
# dart2wasm, in Chrome. A release (release.yml) calls this workflow and publishes the packages
# it uploads.
name: wasm

on:
  push:
    branches: [main]
    paths:
      - crates/teigeodata-api/**
      - crates/teigeodata-engine/**
      - crates/teigeodata-format/**
      - crates/teigeodata-core/**
      - crates/teigeodata-blob/**
      - crates/teigeodata-names/**
      - bindings/wasm/**
      - bindings/Cargo.toml
      - bindings/Cargo.lock
      - bindings/parity.json
      - bindings/fixtures/**
      - xtask/src/package_wasm.rs
      - xtask/templates/wasm*
      # The Dart package's web layer runs on these packages (job dart-web).
      - bindings/dart/lib/**
      - bindings/dart/test/**
      - bindings/dart/pubspec.yaml
      - xtask/templates/dart*
      - site/examples/wasm/**
      - site/examples/tour.out
      - .github/workflows/wasm.yml
      - .github/actions/wasm-tools/**
  workflow_dispatch:
  # release.yml builds a release with this workflow and publishes what it uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from release.yml, `github.workflow` is the caller's: a release never cancels a
  # push run, nor a push run a release.
  group: ${{ github.workflow }}-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build, budgets, Node.js, Bun and Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/wasm-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Packages, budgets and parity on Node.js, Bun and Deno
        run: cargo xtask package-wasm --test
      # The docs site's WebAssembly tour on the pinned public pack (D-322).
      - name: The WebAssembly tour
        run: cargo xtask docs-examples --fetch --check --lang wasm
      - name: Every host ran
        run: |
          for host in node bun deno; do command -v "$host"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-packages
          path: target/wasm/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node.js ${{ matrix.node }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: target/wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Parity from each package
        run: |
          for v in full lookup; do node bindings/wasm/test/parity.mjs "target/wasm/$v" bindings/parity.json; done

  browsers:
    name: Chromium, Firefox and WebKit
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: target/wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Playwright and its browsers (versions in package-lock.json)
        working-directory: bindings/wasm/test
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Parity from each package in each browser
        run: |
          for v in full lookup; do node bindings/wasm/test/browser.mjs "target/wasm/$v" bindings/parity.json; done

  dart-web:
    name: Dart on the web (dart2js, dart2wasm)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: target/wasm
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Parity in Chrome, from the full package
        working-directory: bindings/dart
        run: |
          dart pub get --no-example
          dart test -p chrome --compiler dart2js,dart2wasm test/web_parity_test.dart

  workerd:
    name: Workers (workerd)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: target/wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Miniflare (versions in package-lock.json)
        working-directory: bindings/wasm/test
        run: npm ci --no-audit --no-fund
      - name: Parity from each package in workerd
        run: |
          for v in full lookup; do node bindings/wasm/test/workerd.mjs "target/wasm/$v" bindings/parity.json; done
