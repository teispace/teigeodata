# The docs site (phase 7, ADR-0024, docs/02-research/notes/docs-site.md): Fumadocs on Next.js,
# a static export served by Vercel at https://teigeodata.teispace.com (D-353; GitHub Pages
# serves the signed catalog). Every push that touches the site
# or what it is generated from builds it, type-checks it, checks every internal link and runs
# the playground in Chromium on the WebAssembly package built from the same commit
# (docs/02-research/notes/docs-playground.md). A push to main, once the repository variable
# DOCS_DEPLOY is true, force-pushes the built site as one commit to the branch `docs-site`;
# the Vercel project, connected to the repository with `docs-site` as its production branch
# and no build step, serves it. No token or secret: Vercel's GitHub app deploys the branch.
name: docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - bindings/idl.json
      # The playground runs the engine built from these.
      - crates/teigeodata-api/**
      - crates/teigeodata-engine/**
      - crates/teigeodata-format/**
      - crates/teigeodata-core/**
      - crates/teigeodata-blob/**
      - crates/teigeodata-names/**
      - bindings/wasm/**
      - xtask/src/playground.rs
      - xtask/src/package_wasm.rs
      - .github/actions/wasm-tools/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/**
      - bindings/idl.json
      # The playground runs the engine built from these.
      - crates/teigeodata-api/**
      - crates/teigeodata-engine/**
      - crates/teigeodata-format/**
      - crates/teigeodata-core/**
      - crates/teigeodata-blob/**
      - crates/teigeodata-names/**
      - bindings/wasm/**
      - xtask/src/playground.rs
      - xtask/src/package_wasm.rs
      - .github/actions/wasm-tools/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Served at the root of its own domain.
  DOCS_BASE_PATH: ""

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wasm-tools # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Guides match their generator
        run: python3 scripts/guides.py --check
      - name: Install
        run: npm ci
      - name: The playground's engine, pack and map worker
        working-directory: .
        run: cargo xtask playground --fetch
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Links
        run: node scripts/check-links.mjs out "$DOCS_BASE_PATH"
      - name: The search index within its budget
        run: node scripts/check-search.mjs out
      - name: Chromium (the Playwright version in package-lock.json)
        run: npx playwright install --with-deps chromium-headless-shell
      - name: The playground, run in Chromium
        run: node scripts/check-playground.mjs out "$DOCS_BASE_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: out
      - name: The built site as one commit on `docs-site` (Vercel deploys the branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd out
          # Static files as built; Vercel serves them with no build step.
          printf '%s\n' '{"buildCommand": "", "installCommand": "", "framework": null, "outputDirectory": "."}' > vercel.json
          git init -q -b docs-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs site from $SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" docs-site
