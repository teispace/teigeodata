# The data build and its gates (docs/06-engineering/ci.md, phase 3 step 3.7): one job per pack
# fetches the recipe's inputs (moving sources from the content-addressed mirror, D-127), builds
# it, and gates it: G-det (the build stage run twice gives identical bytes), G-lic and the
# notices (`cargo xtask check-pack`, D-126), G-corr (inside the build), and the golden gate on
# the product's search against the checked-in baseline (no class may lose a hit).
#
# Weekly, and by hand; the mirror release `sources` is published (D-203).
name: data-build

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      release:
        description: Release version the packs are built as
        default: 2026.11.0

permissions:
  contents: read

concurrency:
  group: data-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RELEASE: ${{ inputs.release || '2026.11.0' }}

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: np, build: main, flag: "" }
          - { cc: np, build: lite, flag: "--lite" }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk (inputs and build need about 20 GB; Overture's divisions are 5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            forge
      - name: Build the forge and the evaluator
        run: |
          cargo build --manifest-path forge/Cargo.toml --profile fast --bin forge --locked
          cargo build --release -p spike-s3-search --bin pack-eval --locked
      - name: ID registries of the last data release (D-261)
        # The published IDs: the build keeps them. A build no release has carried yet numbers
        # afresh, and says so; any other failure stops the job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(cargo xtask ids restore --build ${{ matrix.build }} 2>&1); then
            echo "$out"; echo "IDS=" >> "$GITHUB_ENV"
          else
            echo "$out"
            echo "$out" | grep -q 'no data release carries' || exit 1
            echo "::notice::no released ${{ matrix.build }} registry: numbering afresh"
            echo "IDS=--fresh-ids" >> "$GITHUB_ENV"
          fi
      - name: Fetch and build
        run: forge/target/fast/forge make ${{ matrix.cc }} --release "$RELEASE" ${{ matrix.flag }} ${IDS:+"$IDS"} --fetch
      - name: G-det (the build stage again, byte for byte)
        run: |
          dir=data/build/pack/${{ matrix.cc }}
          pack=$dir/${{ matrix.cc }}-places-${{ matrix.build }}.tgd
          cp "$pack" first.tgd
          rm "$dir/.key-${{ matrix.build }}"
          forge/target/fast/forge make ${{ matrix.cc }} --release "$RELEASE" ${{ matrix.flag }}
          cmp first.tgd "$pack"
      - name: G-lic and notices
        run: |
          cargo xtask check-pack data/build/pack/${{ matrix.cc }}/${{ matrix.cc }}-places-${{ matrix.build }}.tgd ${{ matrix.flag }}
          # The country's baseline slice, when its recipe builds one (D-145).
          slice=data/build/baseline/${{ matrix.cc }}/${{ matrix.cc }}-baseline-${{ matrix.build }}.tgd
          if [ -f "$slice" ]; then cargo xtask check-pack "$slice" ${{ matrix.flag }}; fi
      - name: World part of the baseline (D-147, D-150, D-151, D-155, D-157)
        # Every country with a pack must be built first (the ID gate reads its registry); with
        # one pack country this job holds them all. A second one moves this into its own job.
        run: |
          forge/target/fast/forge fetch ne-admin0-nep
          forge/target/fast/forge fetch ne-admin1
          forge/target/fast/forge fetch tzdb-2026f
          # Units' populations, which importance weighs (D-266).
          forge/target/fast/forge fetch wikidata-unit-population
          # ISO 3166 codes: Wikidata's, checked against CLDR's current list (D-271).
          forge/target/fast/forge fetch cldr-49-subdivision-validity wikidata-iso3166-2
          # Main's admin 0 and 1 come from Overture's divisions (D-155); lite keeps Natural
          # Earth's (ODbL is not allowed there).
          if [ "${{ matrix.build }}" = main ]; then
            forge/target/fast/forge fetch overture-divisions
          fi
          # The released registries when there are any, else a first build (D-260, D-261).
          forge/target/fast/forge world --release "$RELEASE" ${{ matrix.flag }} ${IDS:+"$IDS"}
          cargo xtask check-pack data/build/baseline/world/world-baseline-${{ matrix.build }}.tgd ${{ matrix.flag }}
      - name: The shipped baseline, one file (D-153; Z1 fails the stage past 8 MB)
        run: |
          forge/target/fast/forge embed ${{ matrix.flag }}
          cargo xtask check-pack data/build/baseline/baseline-${{ matrix.build }}.tgd ${{ matrix.flag }}
          TEIGEODATA_BASELINE=$PWD/data/build/baseline/baseline-${{ matrix.build }}.tgd \
            cargo test --release -p teigeodata-engine --features baseline --test baseline
      - name: World, locator and shipped-baseline gates (tests/world.rs, D-147, D-149, D-150, D-153)
        run: |
          b=${{ matrix.build }}
          export TGD_EMBED=$PWD/data/build/baseline/baseline-$b.tgd
          # `--all-features` takes `baseline`, which embeds this file.
          export TEIGEODATA_BASELINE=$TGD_EMBED
          export TGD_WORLD=$PWD/data/build/baseline/world/world-baseline-$b.tgd
          export TGD_PROBES=$PWD/data/build/baseline/world/world-probes-$b.tsv
          export TGD_BASELINE=$PWD/data/build/baseline/${{ matrix.cc }}/${{ matrix.cc }}-baseline-$b.tgd
          export TGD_PACK=$PWD/data/build/pack/${{ matrix.cc }}/${{ matrix.cc }}-places-$b.tgd
          cargo test --release -p teigeodata-engine --all-features --test world -- --ignored --nocapture
      - name: Golden gate (product search)
        env:
          S3_ENGINE: product
          S3_GATE: tests/golden/${{ matrix.cc }}-baseline-${{ matrix.build }}.tsv
        run: |
          dir=data/build/pack/${{ matrix.cc }}
          target/release/pack-eval "$dir/${{ matrix.cc }}-places-${{ matrix.build }}.tgd" \
            tests/golden/${{ matrix.cc }}.yaml "$dir/${{ matrix.cc }}-ids-${{ matrix.build }}.tsv"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cc }}-${{ matrix.build }}-reports
          path: |
            data/build/pack/${{ matrix.cc }}/*-${{ matrix.build }}.md
            data/build/pack/${{ matrix.cc }}/*-${{ matrix.build }}.tsv
            data/build/baseline/${{ matrix.cc }}/*-${{ matrix.build }}.md
            data/build/baseline/world/*-${{ matrix.build }}.md
            data/build/baseline/summary-${{ matrix.build }}.md
          if-no-files-found: ignore
