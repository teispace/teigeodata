# Fast checks on every push and pull request (docs/06-engineering/ci.md). Budget: 10 minutes.
name: fast-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs check
        run: cargo xtask check-docs
      - name: Country data and source lock
        run: cargo xtask check-data
      - name: Workspace lint tables
        run: cargo xtask check-workspace
      - name: The engine with no component features (D-137)
        run: |
          cargo clippy --locked -p teigeodata-engine --all-targets --no-default-features --features mmap
          cargo test --locked -p teigeodata-engine --no-default-features --features mmap
      - name: The engine as the catalog's resolver (D-164)
        run: |
          cargo clippy --locked -p teigeodata-engine --all-targets --features catalog
          cargo test --locked -p teigeodata-engine --features catalog --test discover
      - name: no_std crates build without std
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-core -p teigeodata-format -p teigeodata-names -p teigeodata-blob --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features trust --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features repo --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features install --target thumbv7em-none-eabihf

  # Windows (D-190): the store and the CLI on NTFS, sparse files included (D-189). Linux and
  # macOS paths run in `check` and on the maintainer's Mac; this is the only Windows run.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lints
        run: cargo clippy --locked -p teigeodata-sync -p teigeodata-cli --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked -p teigeodata-sync -p teigeodata-cli --all-features

  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: forge
      - name: Format
        run: cargo fmt --manifest-path forge/Cargo.toml --all --check
      - name: Lints
        run: cargo clippy --manifest-path forge/Cargo.toml --workspace --all-targets --locked
      - name: Tests
        run: cargo test --manifest-path forge/Cargo.toml --workspace --locked

  # The generated bindings: drift and the header against cbindgen, then every language's
  # parity suite against bindings/parity.json (docs/04-architecture/bindings.md).
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            bindings -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cbindgen@0.29.4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Generated files are current; the header matches cbindgen
        run: cargo xtask bindings --check
      - name: Shim format and lints
        run: |
          cargo fmt --manifest-path bindings/Cargo.toml --all --check
          cargo clippy --manifest-path bindings/Cargo.toml --workspace --all-targets --locked
      - name: Build the C ABI and the shims
        id: build
        run: |
          cargo build --release --locked -p teigeodata-ffi --lib
          cd bindings
          PYO3_BUILD_EXTENSION_MODULE=1 cargo build --release --locked -p teigeodata-python
          cargo build --release --locked -p teigeodata-node -p teigeodata-jvm
          cp target/release/libteigeodata_python.so python/teigeodata/_native.abi3.so
          cp target/release/libteigeodata_node.so node/teigeodata.node
      - name: C
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic bindings/c/parity.c -Ibindings/c \
            -Ltarget/release -lteigeodata_ffi -Wl,-rpath,"$PWD/target/release" -o target/c-parity
          target/c-parity
          echo '#include "teigeodata.h"' | c++ -x c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Ibindings/c -
      - name: Python
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Node.js
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/node
        run: node --test test/parity.test.js
      - name: JVM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings
        run: |
          javac -d jvm/build jvm/java/org/teispace/teigeodata/*.java jvm/test/org/teispace/teigeodata/*.java
          java --enable-native-access=ALL-UNNAMED -Djava.library.path=target/release -cp jvm/build \
            org.teispace.teigeodata.ParityTest parity.json
      - name: Dart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" dart test
      - name: Swift
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/swift
        run: |
          swift --version
          swift run -c release Parity ../parity.json

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: forge/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bindings/Cargo.toml

  tuf-oracle:
    # python-tuf rebuilds and judges the differential corpus; any change to it fails (D-161).
    # It also reads the repository our writer wrote (D-163).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Oracles
        run: |
          python3 -m venv "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle/bin/pip" install --quiet -r tools/tuf-oracle/requirements.txt
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/generate.py crates/teigeodata-sync/tests/tuf
          git status --porcelain crates/teigeodata-sync/tests/tuf
          test -z "$(git status --porcelain crates/teigeodata-sync/tests/tuf)"
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/check_schema.py crates/teigeodata-sync/schema/catalog-custom-v1.json
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/read_written.py crates/teigeodata-sync/tests/tuf-written

  tough-oracle:
    # tough judges the repositories our writer writes at run time, against the real clock,
    # case by case with our client (D-165). Its own workspace: tough never enters the product.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/tough-oracle
      - name: Lints
        run: cargo clippy --locked --release --manifest-path tools/tough-oracle/Cargo.toml -- -D warnings
      - name: Differential
        run: cargo run --locked --release --manifest-path tools/tough-oracle/Cargo.toml

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
