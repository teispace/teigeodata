# Fast checks on every push and pull request (docs/06-engineering/ci.md). Budget: 10 minutes.
name: fast-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Query-parsing and MCP fuzz harnesses, seeded (nightly runs them under libFuzzer)
        run: cargo test --locked -p teigeodata-server --features fuzz,mcp --test fuzz
      - name: Docs check
        run: cargo xtask check-docs
      - name: The unsafe inventory is the code's
        run: cargo xtask unsafe-audit --check
      - name: Country data and source lock
        run: cargo xtask check-data
      - name: Workspace lint tables
        run: cargo xtask check-workspace
      - name: The engine with no component features (D-137)
        run: |
          cargo clippy --locked -p teigeodata-engine --all-targets --no-default-features --features mmap
          cargo test --locked -p teigeodata-engine --no-default-features --features mmap
      - name: The API with no component features (D-291)
        run: |
          cargo clippy --locked -p teigeodata-api --all-targets --no-default-features
          cargo test --locked -p teigeodata-api --no-default-features
      - name: The engine as the catalog's resolver (D-164)
        run: |
          cargo clippy --locked -p teigeodata-engine --all-targets --features catalog
          cargo test --locked -p teigeodata-engine --features catalog --test discover
      - name: no_std crates build without std
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-core -p teigeodata-format -p teigeodata-names -p teigeodata-blob --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features trust --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features repo --target thumbv7em-none-eabihf
          cargo build --locked -p teigeodata-sync --no-default-features --features install --target thumbv7em-none-eabihf

  # Windows (D-190): the store and the CLI on NTFS, sparse files included (D-189). Linux and
  # macOS paths run in `check` and on the maintainer's Mac; this is the only Windows run.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lints
        run: cargo clippy --locked -p teigeodata-sync -p teigeodata-cli -p teigeodata-server --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --no-fail-fast -p teigeodata-sync -p teigeodata-cli -p teigeodata-server --all-features

  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: forge
      - name: Format
        run: cargo fmt --manifest-path forge/Cargo.toml --all --check
      - name: Lints
        run: cargo clippy --manifest-path forge/Cargo.toml --workspace --all-targets --locked
      - name: Tests
        run: cargo test --manifest-path forge/Cargo.toml --workspace --locked

  # The generated bindings: drift and the header against cbindgen, then every language's
  # parity suite against bindings/parity.json (docs/04-architecture/bindings.md).
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ABI gate reads the last release's header: full history and tags, blobs on
          # demand.
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            bindings -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cbindgen@0.29.4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      # gofmt formats the generated Go files.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: bindings/go/go.sum
      - name: Generated files are current; the header matches cbindgen
        run: cargo xtask bindings --check
      - name: Shim format and lints
        run: |
          cargo fmt --manifest-path bindings/Cargo.toml --all --check
          cargo clippy --manifest-path bindings/Cargo.toml --workspace --all-targets --locked
      - name: Build the C ABI and the shims
        id: build
        run: |
          cargo build --release --locked -p teigeodata-ffi --lib
          cd bindings
          PYO3_BUILD_EXTENSION_MODULE=1 cargo build --release --locked -p teigeodata-python
          cargo build --release --locked -p teigeodata-node -p teigeodata-jvm
          cp target/release/libteigeodata_python.so python/teigeodata/_native.abi3.so
          cp target/release/libteigeodata_node.so node/teigeodata.node
      - name: ABI gates (D-285)
        run: cargo xtask abi --lib target/release/libteigeodata_ffi.so
      - name: C and C++
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic bindings/c/parity.c -Ibindings/c \
            -Ltarget/release -lteigeodata_ffi -Wl,-rpath,"$PWD/target/release" -o target/c-parity
          target/c-parity
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Wconversion bindings/c/parity.cpp -Ibindings/c \
            -Ltarget/release -lteigeodata_ffi -Wl,-rpath,"$PWD/target/release" -o target/cpp-parity
          target/cpp-parity
          echo '#include "teigeodata.h"' | c++ -x c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Ibindings/c -
      - name: Python
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Node.js
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/node
        run: node --test test/parity.test.js
      - name: JVM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings
        run: |
          javac -d jvm/build jvm/java/org/teispace/teigeodata/*.java jvm/test/org/teispace/teigeodata/*.java
          java --enable-native-access=ALL-UNNAMED -Djava.library.path=target/release -cp jvm/build \
            org.teispace.teigeodata.ParityTest parity.json
      - name: Dart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/dart
        run: |
          dart pub get --no-example
          dart analyze --fatal-infos
          dart format --set-exit-if-changed hook test bench
          # The build hook builds teigeodata-c from this checkout (D-289).
          dart test
      - name: Swift
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/swift
        run: |
          swift --version
          swift run -c release Parity ../parity.json
      - name: Go
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/go
        env:
          TEIGEODATA_LIB: ${{ github.workspace }}/target/release/libteigeodata_ffi.so
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          CGO_ENABLED=0 go vet ./...
          go test -count=1 -race ./...
          CGO_ENABLED=0 go test -count=1 ./...
          go test -run '^$' -fuzz FuzzReader -fuzztime 20s .
      # Every language's tour of the docs site, run on the pinned public pack, its output
      # checked (D-322): what the guides show is what ran. Before the lite build below, which
      # replaces the C library. Rust and the CLI run in the examples job, WebAssembly in
      # wasm.yml, .NET in dotnet.yml.
      - name: Docs examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo xtask docs-examples --fetch --check --lang python,node,go,swift,dart,java,kotlin,c,cpp
      # The parity gate's sample: the first value of each section planted in every language
      # (5.9); the full gate runs in parity-mutants.yml.
      - name: Parity gate sample
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo xtask parity-mutants --sample --jobs 2
      - name: Lite library symbols (D-285)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo build --release --locked -p teigeodata-ffi --lib --no-default-features --features components
          cargo xtask abi --lib target/release/libteigeodata_ffi.so --lite
      - name: Go on the lite library (the store's calls are MissingComponent)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bindings/go
        env:
          TEIGEODATA_LIB: ${{ github.workspace }}/target/release/libteigeodata_ffi.so
        run: |
          out=$(go test -count=1 -v -run 'Store|Version' . 2>&1)
          echo "$out"
          grep -q -- '--- SKIP: TestStore' <<<"$out"

  # The docs site's Rust and CLI tours on the pinned public pack (D-322).
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: tgd as it ships
        run: cargo build --release --locked -p teigeodata-cli
      - name: The Rust and CLI tours
        run: cargo xtask docs-examples --fetch --check --lang rust,cli
      - name: The coverage and country pages match the pinned pack and data/countries
        run: cargo xtask data-pages --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: forge/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bindings/Cargo.toml

  tuf-oracle:
    # python-tuf rebuilds and judges the differential corpus; any change to it fails (D-161).
    # It also reads the repository our writer wrote (D-163).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Oracles
        run: |
          python3 -m venv "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle/bin/pip" install --quiet -r tools/tuf-oracle/requirements.txt
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/generate.py crates/teigeodata-sync/tests/tuf
          git status --porcelain crates/teigeodata-sync/tests/tuf
          test -z "$(git status --porcelain crates/teigeodata-sync/tests/tuf)"
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/check_schema.py crates/teigeodata-sync/schema/catalog-custom-v1.json
          "$RUNNER_TEMP/oracle/bin/python" -I tools/tuf-oracle/read_written.py crates/teigeodata-sync/tests/tuf-written

  tough-oracle:
    # tough judges the repositories our writer writes at run time, against the real clock,
    # case by case with our client (D-165). Its own workspace: tough never enters the product.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/tough-oracle
      - name: Lints
        run: cargo clippy --locked --release --manifest-path tools/tough-oracle/Cargo.toml -- -D warnings
      - name: Differential
        run: cargo run --locked --release --manifest-path tools/tough-oracle/Cargo.toml

  competitive-harness:
    # Suite C's harness (tools/competitive), its own workspace: built, linted and its unit
    # tests run on every push, so an engine change that breaks it is found before a release
    # needs the report (D-340). The report itself runs in competitive.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/competitive
      - name: Lints
        run: cargo clippy --locked --release --all-targets --manifest-path tools/competitive/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --locked --release --manifest-path tools/competitive/Cargo.toml

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  # The workflows themselves (phase 8.2, threat model §7): template injection, excess
  # permissions, credentials left in checkouts, unpinned or impostor actions, cache poisoning.
  # zizmor is pinned; online audits (known-vulnerable actions, impostor commits) use the run's
  # read-only token. A finding fails the job; one kept on purpose is ignored in
  # `.github/zizmor.yml` with its reason.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec 'zizmor==1.32.0' zizmor --format=github --persona=regular .github
