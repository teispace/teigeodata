# The Swift package's XCFramework (phase 5.3, D-287): `cargo xtask package-swift --test` builds
# it for iOS, the iOS simulators and macOS, and runs the Swift parity checks against it on
# macOS and on an iOS simulator. On a `v*` tag the zip and its SwiftPM checksum are attached
# to the release.
name: apple

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - crates/teigeodata-c/**
      - crates/teigeodata-ffi/**
      - bindings/swift/**
      - bindings/c/teigeodata.h
      - bindings/parity.json
      - bindings/fixtures/**
      - xtask/src/package_swift.rs
      - .github/workflows/apple.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  xcframework:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tools
        run: xcodebuild -version && swift --version && xcrun simctl list devices available | grep iPhone | head -3
      - name: XCFramework, tested on macOS and an iOS simulator
        run: cargo xtask package-swift --test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-xcframework
          path: |
            target/apple/CTeiGeodata.xcframework.zip
            target/apple/CTeiGeodata.xcframework.zip.checksum
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: xcframework
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teigeodata-xcframework
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/CTeiGeodata.xcframework.zip dist/CTeiGeodata.xcframework.zip.checksum --clobber --repo "$GITHUB_REPOSITORY"
