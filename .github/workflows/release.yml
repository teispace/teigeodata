# A release (phase 5.10, docs/02-research/notes/release-pipeline.md): the build workflows,
# called as they run in CI, then every file they built gathered, given SBOMs and SHA256SUMS,
# and attested (SLSA build provenance through Sigstore), each attestation verified. Run by hand;
# `dry_run` (the default) stops before anything leaves the repository.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, attest and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version every artifact carries: the workspace's, which each binding's parity test
  # checks against its own.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history with every blob: `cargo semver-checks` checks the last release out
          # through its own git library, which cannot fetch a partial clone's missing blobs
          # (dry run 43700863511: "an object ... could not be found").
          fetch-depth: 0
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::warning::v$v is already tagged: a real release needs a version bump first"
            test "$DRY_RUN" = true
          fi
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: ABI release gate (the version covers the C ABI's changes since the last release)
        run: |
          # The release is not tagged yet: the newest tag reachable is the last release.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' HEAD)
          if ! cargo xtask abi --since "$prev" --release; then
            echo "::warning::the ABI release gate fails: a real release stops here"
            test "$DRY_RUN" = true
          fi
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Rust API release gate (the version covers the published crates' changes)
        # Every crate with `publish = true`, default features, against the last release's
        # tag. Before 1.0 a minor bump may break; from 1.0 only a major may (semver.md).
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' HEAD)
          # The checks build every feature; `baseline` embeds the file this names at compile
          # time. Any pack does for the API, so the bindings' fixture stands in (absolute path,
          # read by both the current and the baseline build).
          export TEIGEODATA_BASELINE="$PWD/bindings/fixtures/synth.tgd"
          # Each published library that existed at the last tag; one added since has no
          # baseline to compare with (cargo-semver-checks stops on it).
          pkgs=()
          while read -r name manifest; do
            if git cat-file -e "$prev:$manifest" 2>/dev/null; then
              pkgs+=(--package "$name")
            else
              echo "$name: new since $prev, nothing to compare"
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -r --arg root "$PWD/" \
            '.packages[] | select(.publish == null and any(.targets[]; .kind | index("lib")))
              | "\(.name) \(.manifest_path | ltrimstr($root))"')
          if ! cargo semver-checks "${pkgs[@]}" --baseline-rev "$prev"; then
            echo "::warning::the Rust API release gate fails: a real release stops here"
            test "$DRY_RUN" = true
          fi

  c:
    needs: version
    uses: ./.github/workflows/c-package.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
  apple:
    needs: version
    uses: ./.github/workflows/apple.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
  jvm:
    needs: version
    uses: ./.github/workflows/jvm.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
  python:
    needs: version
    uses: ./.github/workflows/python.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
  node:
    needs: version
    uses: ./.github/workflows/node.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on
  wasm:
    needs: version
    uses: ./.github/workflows/wasm.yml # zizmor: ignore[self-repository] the same commit; the $/ form is too new to rely on

  # Every file of the release in one place, with its SBOMs and checksums, attested and verified.
  assemble:
    needs: [version, c, apple, jvm, python, node, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-cyclonedx@0.5.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The C archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: teigeodata-c-*
          path: dist
          merge-multiple: true
      - name: The libraries alone, for Dart and Go
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: teigeodata-prebuilt-*
          path: dist
          merge-multiple: true
      - name: The XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teigeodata-xcframework
          path: dist
      - name: The JAR and the AAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # teigeodata-jar and teigeodata-aar
          pattern: teigeodata-?ar
          path: dist
          merge-multiple: true
      - name: The wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: The Node.js packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-packages
          path: npm/node
      - name: The WebAssembly packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: npm/wasm
      - name: Pack the npm packages
        run: |
          for d in npm/node/*/ npm/wasm/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist"); done
      - name: The release has every artifact, each of this version
        run: |
          cd dist
          ls -l
          for f in "teigeodata-c-$VERSION-"* "teigeodata-$VERSION-"* CTeiGeodata.xcframework.zip CTeiGeodata.xcframework.zip.checksum \
                   teigeodata-*"$VERSION"*.jar teigeodata-*"$VERSION"*.aar "teigeodata-$VERSION-"*.whl \
                   "teispace-teigeodata-$VERSION.tgz" "teispace-teigeodata-wasm-$VERSION.tgz"; do
            compgen -G "$f" >/dev/null || { echo "::error::missing: $f"; exit 1; }
          done
      - name: SBOMs (CycloneDX) of every crate the artifacts are built from
        run: |
          mkdir -p dist/sbom
          cargo cyclonedx --format json --all-features
          (cd bindings && cargo cyclonedx --format json --all-features)
          # One SBOM per crate, written beside its Cargo.toml; published under the crate's name.
          sbom() {
            set -- "$1"/*.cdx.json "$2"
            test "$#" -eq 2 && test -f "$1" || { echo "::error::no single SBOM for $2"; exit 1; }
            cp "$1" "dist/sbom/$2.cdx.json"
          }
          for c in teigeodata-c teigeodata-api teigeodata-engine teigeodata-sync teigeodata-cli; do
            sbom "crates/$c" "$c"
          done
          for c in python node jvm wasm; do
            sbom "bindings/$c" "teigeodata-$c"
          done
          ls -l dist/sbom
      - name: Checksums
        run: |
          cd dist
          sums=$(find . -type f | sed 's|^\./||' | sort | xargs sha256sum)
          echo "$sums" > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            dist/sbom/*
      - name: The C library's SBOM, attested for its archives and the XCFramework
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/teigeodata-c-*
            dist/CTeiGeodata.xcframework.zip
          sbom-path: dist/sbom/teigeodata-c.cdx.json
      - name: The JVM binding's SBOM, attested for the JAR and the AAR
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.jar
            dist/*.aar
          sbom-path: dist/sbom/teigeodata-jvm.cdx.json
      - name: The Node.js binding's SBOM, attested for its package
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/teispace-teigeodata-${{ env.VERSION }}.tgz
          sbom-path: dist/sbom/teigeodata-node.cdx.json
      - name: The WebAssembly binding's SBOM, attested for its packages
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/teispace-teigeodata-wasm-*.tgz
          sbom-path: dist/sbom/teigeodata-wasm.cdx.json
      - name: Every attestation verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          n=0
          for f in * sbom/*; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
            n=$((n + 1))
          done
          echo "verified: $n files"
          set -- teigeodata-c-"$VERSION"-*
          gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom >/dev/null
          echo "verified: the C library's SBOM attestation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  # The release commit and each registry's own check of what it would publish (D-304). The
  # commit pins the prebuilt files into the Dart hook, the Go loader and the root
  # Package.swift; a dry run makes it locally and pushes nothing.
  packages:
    needs: [version, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/dist
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: The release commit
        run: |
          cargo xtask release-pin "$RUNNER_TEMP/dist"
          git add -A bindings/dart/hook/src/prebuilt_hashes.dart bindings/go/internal/prebuilt/prebuilt.go Package.swift
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s -q -m "chore(repo): release v$VERSION"
          git show --stat HEAD
          cargo xtask release-pin "$RUNNER_TEMP/dist" --check
          # The commit travels to the publishing job as a bundle on top of the dispatched one.
          git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
      - name: Swift (the released Package.swift)
        run: swift package dump-package > /dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Go (module bindings/go, tagged bindings/go/v${{ env.VERSION }})
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          grep -q '^const Version = "'"$VERSION"'"$' internal/prebuilt/prebuilt.go
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: pub.dev
        working-directory: bindings/dart
        run: dart pub publish --dry-run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: npm
        run: |
          for p in "$RUNNER_TEMP"/dist/teispace-*.tgz; do npm publish --dry-run --access public "$p"; done
      - name: PyPI
        run: pipx run twine==7.0.0 check --strict "$RUNNER_TEMP"/dist/*.whl
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Maven Central (the bundle, unsigned in a dry run)
        run: cargo xtask package-jvm --maven "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-bundle-${{ env.VERSION }}
          path: target/jvm/central-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit-${{ env.VERSION }}
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 30

  # ---- A real run (dry_run off), each job approved in the `release` environment ----
  #
  # The release commit on `main` and the tags `vX.Y.Z` (Swift, pub.dev) and
  # `bindings/go/vX.Y.Z` (Go), pushed with the deploy key so the tag push starts `pub.yml`; then
  # a draft release with every file, published (an immutable release takes assets only as a
  # draft). `main` must still be the dispatched commit, or the push is refused and nothing is
  # published.
  github-release:
    if: ${{ !inputs.dry_run }}
    needs: [version, assemble, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with these credentials
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit-${{ env.VERSION }}
          path: ${{ runner.temp }}
      - name: The release commit and its tags
        run: |
          git bundle verify "$RUNNER_TEMP/release.bundle"
          git fetch -q "$RUNNER_TEMP/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          test "$(git rev-parse "$commit^")" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$commit"
          git tag -a "bindings/go/v$VERSION" -m "bindings/go v$VERSION" "$commit"
          # One push: main moves only if it is still the dispatched commit (no force).
          git push --atomic origin "$commit:refs/heads/main" "v$VERSION" "bindings/go/v$VERSION"
      - name: The release notes, from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Draft, upload, publish
        run: |
          gh release create "v$VERSION" --verify-tag --draft --title "v$VERSION" --notes-file notes.md
          mapfile -t files < <(find dist -type f | sort)
          gh release upload "v$VERSION" -- "${files[@]}"
          gh release edit "v$VERSION" --draft=false
          gh release view "v$VERSION"

  # The crates: the stable surface and what it needs (D-303), in dependency order. A dry run
  # packages and builds each against the others as packaged; a real run publishes through
  # crates.io trusted publishing (no stored token), after the GitHub release.
  crates:
    needs: [version, packages, github-release]
    if: ${{ !cancelled() && needs.packages.result == 'success' && (inputs.dry_run || needs.github-release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.dry_run && 'dry-run' || 'release' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Every crate packages and builds as published
        if: ${{ inputs.dry_run }}
        run: cargo publish --workspace --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: ${{ !inputs.dry_run }}
        id: auth
      - name: Publish (in dependency order; a version already there is skipped, so a re-run resumes)
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for c in core blob names format sync engine api server cli; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "teigeodata-release" \
              "https://crates.io/api/v1/crates/teigeodata-$c/$VERSION")
            if [ "$code" = 200 ]; then echo "teigeodata-$c $VERSION: already published"; continue; fi
            cargo publish --locked -p "teigeodata-$c"
          done

  # npm through trusted publishing (provenance is published with it).
  npm:
    if: ${{ !inputs.dry_run }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install -g npm@12.2.2
          npm --version
      - name: Publish (a version already there is skipped)
        run: |
          for p in dist/teispace-*.tgz; do
            name=$(tar -xzOf "$p" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then echo "$name@$VERSION: already published"; continue; fi
            npm publish --access public "$p"
          done

  # PyPI through trusted publishing, with PEP 740 attestations (only from a top-level workflow).
  pypi:
    if: ${{ !inputs.dry_run }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/all
      - name: The wheels alone
        run: mkdir -p wheels && cp "$RUNNER_TEMP"/all/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels/
          skip-existing: true

  # Maven Central: no OIDC, so a Portal user token and a GPG key, secrets of the `release`
  # environment. The bundle is signed, uploaded, validated and published by the Portal.
  maven:
    if: ${{ !inputs.dry_run }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ env.VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/dist
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Already on Maven Central?
        id: there
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/com/teispace/teigeodata/$VERSION/teigeodata-$VERSION.pom")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: The signed bundle
        if: ${{ steps.there.outputs.published == 'false' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Any long option may stand in gpg.conf: the passphrase is read from a file only the
          # runner user can read, removed after signing.
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
          printf 'pinentry-mode loopback\npassphrase-file %s\n' "$RUNNER_TEMP/gpg-pass" > ~/.gnupg/gpg.conf
          cargo xtask package-jvm --maven "$RUNNER_TEMP/dist" --sign
          rm -f ~/.gnupg/gpg.conf "$RUNNER_TEMP/gpg-pass"
          find target/jvm/maven -name '*.asc' | wc -l
      - name: Upload, then wait until the Portal publishes it
        if: ${{ steps.there.outputs.published == 'false' }}
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          auth="Authorization: Bearer $(printf '%s:%s' "$USER" "$TOKEN" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          id=$(curl -sSf -X POST -H "$auth" -F bundle=@target/jvm/central-bundle.zip \
            "$api/upload?publishingType=AUTOMATIC&name=teigeodata-$VERSION")
          echo "deployment $id"
          for _ in $(seq 1 80); do
            state=$(curl -sSf -X POST -H "$auth" "$api/status?id=$id" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "$api/status?id=$id" | jq .errors; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::the deployment did not reach PUBLISHING in 40 minutes"; exit 1

  # Go: the module is the tag; asking the proxy for it makes it available at once.
  go:
    if: ${{ !inputs.dry_run }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: The module on the Go proxy
        run: GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/teispace/teigeodata/bindings/go@v$VERSION"
