# The C library's packages (phase 5.2, D-286): `cargo xtask package-c` per target, full and
# lite, each smoke-tested through pkg-config and CMake where the runner can run it. On a `v*`
# tag the release gate runs and the archives are attached to that release.
name: c-package

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - crates/teigeodata-c/**
      - crates/teigeodata-ffi/**
      - xtask/src/package_c.rs
      - xtask/src/abi.rs
      - xtask/templates/c.h.j2
      - bindings/c/**
      - .github/workflows/c-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on 22.04 so the libraries need glibc 2.35, not the newest.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built; the smoke test is skipped for a cross target.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ABI gate reads the last release's header.
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Release gate (a tag's version covers its ABI changes)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^")
          cargo xtask abi --since "$prev" --release
      - name: Full package
        run: cargo xtask package-c --target ${{ matrix.target }} --smoke
      - name: Lite package
        run: cargo xtask package-c --target ${{ matrix.target }} --lite --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-c-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ./teigeodata-c-* > teigeodata-c-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./teigeodata-c-* --clobber --repo "$GITHUB_REPOSITORY"
