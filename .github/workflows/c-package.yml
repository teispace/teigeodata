# The C library's packages (phase 5.2, D-286): `cargo xtask package-c` per target, full and
# lite, each smoke-tested through pkg-config and CMake where the runner can run it, and the
# library alone for every Dart and Go target, Android and iOS included (D-304). A release
# (release.yml) calls this workflow and publishes the files it uploads.
name: c-package

on:
  push:
    branches: [main]
    paths:
      - crates/teigeodata-c/**
      - crates/teigeodata-ffi/**
      - xtask/src/package_c.rs
      - xtask/src/package_jvm.rs
      - xtask/src/abi.rs
      - xtask/templates/c.h.j2
      - xtask/templates/cpp.hpp.j2
      - bindings/c/**
      - .github/workflows/c-package.yml
  workflow_dispatch:
  # release.yml builds a release with this workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from release.yml, `github.workflow` is the caller's: a release never cancels a
  # push run, nor a push run a release.
  group: ${{ github.workflow }}-c-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on 22.04 so the libraries need glibc 2.35, not the newest.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built; the smoke test is skipped for a cross target.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          # musl: built and smoke-tested in Alpine 3.23 (5.8a).
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, alpine: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, alpine: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ABI gate reads the last release's header.
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (from rust-toolchain.toml)
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !matrix.alpine }}
        with:
          key: ${{ matrix.target }}
      - name: Full package, and its library alone for Dart and Go
        if: ${{ !matrix.alpine }}
        run: cargo xtask package-c --target ${{ matrix.target }} --smoke --prebuilt
      - name: Lite package
        if: ${{ !matrix.alpine }}
        run: cargo xtask package-c --target ${{ matrix.target }} --lite --smoke
      - name: Full and lite packages (Alpine, musl)
        if: ${{ matrix.alpine }}
        run: |
          # The host is musl, so no --target. crt-static off: a musl cdylib links the C library
          # dynamically, as the programs that load it do.
          docker run --rm -v "$PWD:/w" -w /w alpine:3.23 sh -euc '
            apk add --no-cache build-base curl pkgconf cmake git
            # The checkout belongs to the runner user; the ABI gate reads it with git.
            git config --global --add safe.directory /w
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            rustup toolchain install
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo xtask package-c --smoke --prebuilt
            cargo xtask package-c --lite --smoke'
          ls -l target/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-c-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-prebuilt-${{ matrix.target }}
          path: target/package/teigeodata-[0-9]*
          if-no-files-found: error
          retention-days: 14

  # The library alone for Android and iOS, the release assets the Dart hook downloads there
  # (D-304): no C package, since apps on those systems get it through Dart, Swift or the AAR.
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NDK r28 or later links 16 KB aligned; the image's default NDK is older.
          - os: ubuntu-latest
            name: android
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          - os: macos-latest
            name: ios
            targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          # shellcheck disable=SC2086 # a list of targets
          rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: The libraries (own name checked; Android 64-bit 16 KB aligned)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"; fi
          for t in $TARGETS; do cargo xtask package-c --target "$t" --prebuilt; done
          ls -l target/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-prebuilt-${{ matrix.name }}
          path: target/package/teigeodata-[0-9]*
          if-no-files-found: error
          retention-days: 14
