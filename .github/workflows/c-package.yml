# The C library's packages (phase 5.2, D-286): `cargo xtask package-c` per target, full and
# lite, each smoke-tested through pkg-config and CMake where the runner can run it. A release
# (release.yml) calls this workflow with `release`, which runs the ABI release gate, and
# publishes the archives it uploads.
name: c-package

on:
  push:
    branches: [main]
    paths:
      - crates/teigeodata-c/**
      - crates/teigeodata-ffi/**
      - xtask/src/package_c.rs
      - xtask/src/abi.rs
      - xtask/templates/c.h.j2
      - xtask/templates/cpp.hpp.j2
      - bindings/c/**
      - .github/workflows/c-package.yml
  workflow_dispatch:
  # release.yml builds a release with this workflow; `release` runs the ABI release gate.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Called from release.yml, `github.workflow` is the caller's: a release never cancels a
  # push run, nor a push run a release.
  group: ${{ github.workflow }}-c-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on 22.04 so the libraries need glibc 2.35, not the newest.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built; the smoke test is skipped for a cross target.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          # musl: built and smoke-tested in Alpine 3.23 (5.8a).
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, alpine: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, alpine: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ABI gate reads the last release's header.
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (from rust-toolchain.toml)
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !matrix.alpine }}
        with:
          key: ${{ matrix.target }}
      - name: Release gate (the release's version covers its ABI changes since the last one)
        if: ${{ inputs.release && !matrix.alpine }}
        shell: bash
        run: |
          # A release is built before it is tagged: the newest tag is the last release.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          cargo xtask abi --since "$prev" --release
      - name: Full package
        if: ${{ !matrix.alpine }}
        run: cargo xtask package-c --target ${{ matrix.target }} --smoke
      - name: Lite package
        if: ${{ !matrix.alpine }}
        run: cargo xtask package-c --target ${{ matrix.target }} --lite --smoke
      - name: Full and lite packages (Alpine, musl)
        if: ${{ matrix.alpine }}
        run: |
          # The host is musl, so no --target. crt-static off: a musl cdylib links the C library
          # dynamically, as the programs that load it do.
          docker run --rm -v "$PWD:/w" -w /w alpine:3.23 sh -euc '
            apk add --no-cache build-base curl pkgconf cmake git
            # The checkout belongs to the runner user; the ABI gate reads it with git.
            git config --global --add safe.directory /w
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            rustup toolchain install
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo xtask package-c --smoke
            cargo xtask package-c --lite --smoke'
          ls -l target/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-c-${{ matrix.target }}
          path: |
            target/package/*.tar.gz
            target/package/*.zip
          if-no-files-found: error
          retention-days: 14
