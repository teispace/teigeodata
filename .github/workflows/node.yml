# The Node.js packages as they ship (phase 5.7c, D-294): the napi-rs addon prebuilt for eight
# platforms and tested on each (Node.js 22, the oldest supported line), the main package and
# a platform package per addon assembled by `cargo xtask package-node`, then installed on each
# platform as npm would (by `os`, `cpu` and `libc`) and tested from the installed package
# (Node.js 26, the newest). A release (release.yml) calls this workflow and publishes the
# packages it uploads.
name: node

on:
  push:
    branches: [main]
    paths:
      - crates/teigeodata-api/**
      - crates/teigeodata-engine/**
      - bindings/node/**
      - bindings/Cargo.toml
      - bindings/Cargo.lock
      - bindings/parity.json
      - bindings/fixtures/**
      - xtask/src/package_node.rs
      - xtask/templates/node*
      - .github/workflows/node.yml
  workflow_dispatch:
  # release.yml builds a release with this workflow and publishes what it uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from release.yml, `github.workflow` is the caller's: a release never cancels a
  # push run, nor a push run a release.
  group: ${{ github.workflow }}-node-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  addons:
    name: Addon ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc as the C and JVM packages: built on ubuntu-22.04 (glibc 2.35).
          - { os: ubuntu-22.04, suffix: linux-x64-gnu, file: libteigeodata_node.so }
          - { os: ubuntu-22.04-arm, suffix: linux-arm64-gnu, file: libteigeodata_node.so }
          # musl: built and tested in Alpine.
          - { os: ubuntu-24.04, suffix: linux-x64-musl, file: libteigeodata_node.so, alpine: true }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-musl, file: libteigeodata_node.so, alpine: true }
          - { os: macos-latest, suffix: darwin-arm64, file: libteigeodata_node.dylib }
          # Cross-built; tested by an x64 Node.js under Rosetta.
          - { os: macos-latest, suffix: darwin-x64, file: libteigeodata_node.dylib, cross: x86_64-apple-darwin, arch: x64 }
          - { os: windows-latest, suffix: win32-x64-msvc, file: teigeodata_node.dll }
          - { os: windows-11-arm, suffix: win32-arm64-msvc, file: teigeodata_node.dll }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.cross }}" ]; then rustup target add ${{ matrix.cross }}; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !matrix.alpine }}
        with:
          key: node-${{ matrix.suffix }}
          workspaces: bindings -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.alpine }}
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Build and test (Alpine, musl)
        if: ${{ matrix.alpine }}
        run: |
          # A musl cdylib links the C library dynamically (crt-static off), as Alpine's Node.js does.
          docker run --rm -v "$PWD:/w" -w /w node:22-alpine3.23 sh -euc '
            apk add --no-cache build-base curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            rustup toolchain install
            cd bindings
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --locked --profile dist -p teigeodata-node
            cp target/dist/${{ matrix.file }} node/teigeodata.node
            cd node && node --test test/parity.test.js'
      - name: Build
        if: ${{ !matrix.alpine }}
        shell: bash
        working-directory: bindings
        run: cargo build --locked --profile dist -p teigeodata-node ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
      - name: Parity from the addon
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          if [ -n "${{ matrix.cross }}" ]; then dir=bindings/target/${{ matrix.cross }}/dist; else dir=bindings/target/dist; fi
          cp "$dir/${{ matrix.file }}" bindings/node/teigeodata.node
          node -p 'process.platform + "-" + process.arch + " Node.js " + process.version'
          cd bindings/node && node --test test/parity.test.js
      - name: Collect the addon
        shell: bash
        run: |
          mkdir -p addons
          cp bindings/node/teigeodata.node addons/teigeodata.${{ matrix.suffix }}.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-addon-${{ matrix.suffix }}
          path: addons
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: addons
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-addon-*
          path: addons
          merge-multiple: true
      - name: The main package and every platform package
        run: |
          ls -l addons
          cargo xtask package-node --addons addons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-packages
          path: target/node/
          if-no-files-found: error
          retention-days: 14

  install:
    name: Installed on ${{ matrix.suffix }}
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, suffix: linux-x64-gnu }
          - { os: ubuntu-22.04-arm, suffix: linux-arm64-gnu }
          - { os: ubuntu-24.04, suffix: linux-x64-musl, alpine: true }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-musl, alpine: true }
          - { os: macos-latest, suffix: darwin-arm64 }
          - { os: macos-latest, suffix: darwin-x64, arch: x64 }
          - { os: windows-latest, suffix: win32-x64-msvc }
          - { os: windows-11-arm, suffix: win32-arm64-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-packages
          path: target/node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.alpine }}
        with:
          node-version: 26
          architecture: ${{ matrix.arch }}
      - name: Installed as npm would, then parity
        if: ${{ !matrix.alpine }}
        run: node bindings/node/test/install.mjs target/node
      - name: Installed as npm would, then parity (Alpine, musl)
        if: ${{ matrix.alpine }}
        run: docker run --rm -v "$PWD:/w" -w /w node:26-alpine3.24 node bindings/node/test/install.mjs target/node
