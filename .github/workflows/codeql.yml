# CodeQL (phase 8.2, threat model §7): static analysis of the Rust code, the workflows, the
# JavaScript and TypeScript (site, Node and WebAssembly bindings) and the Python binding, with
# results in code scanning. Every language is extracted without a build (`build-mode: none`),
# so nothing heavy runs. Go is left out: it needs a build with cgo and the C library, and its
# binding is a thin layer over the C ABI the Rust analysis covers.
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
