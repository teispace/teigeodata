# The JVM binding as it ships (phase 5.4, D-288): the desktop JAR with the native library of
# six platforms, tested from the JAR on each OS that can run it, and the Android AAR (16 KB
# aligned, NDK r30), tested on emulators at API 24 (its minSdk) and 35. On a `v*` tag both are attached to the release.
name: jvm

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - crates/teigeodata-api/**
      - bindings/jvm/**
      - bindings/Cargo.toml
      - bindings/parity.json
      - bindings/fixtures/**
      - xtask/src/package_jvm.rs
      - xtask/templates/java.j2
      - xtask/templates/jni.rs.j2
      - .github/workflows/jvm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64, file: libteigeodata_jvm.so }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64, file: libteigeodata_jvm.so }
          - { os: macos-latest, platform: macos-aarch64, file: libteigeodata_jvm.dylib }
          - { os: macos-latest, platform: macos-x86_64, file: libteigeodata_jvm.dylib, cross: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, file: teigeodata_jvm.dll }
          # Temurin has no Java 25 for Windows on ARM64; Microsoft's build does.
          - { os: windows-11-arm, platform: windows-aarch64, file: teigeodata_jvm.dll, jdk: microsoft }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.cross }}" ]; then rustup target add ${{ matrix.cross }}; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
          workspaces: |
            . -> target
            bindings -> target
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ matrix.jdk || 'temurin' }}
          java-version: "25"
      - name: The JAR with this platform's library, tested from the JAR
        if: ${{ !matrix.cross }}
        run: cargo xtask package-jvm --desktop --test
      - name: Cross-built library
        if: ${{ matrix.cross }}
        working-directory: bindings
        run: cargo build --locked --profile dist -p teigeodata-jvm --target ${{ matrix.cross }}
      - name: Collect the library
        shell: bash
        run: |
          mkdir -p natives/${{ matrix.platform }}
          if [ -n "${{ matrix.cross }}" ]; then dir=bindings/target/${{ matrix.cross }}/dist; else dir=bindings/target/dist; fi
          cp "$dir/${{ matrix.file }}" natives/${{ matrix.platform }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-native-${{ matrix.platform }}
          path: natives
          if-no-files-found: error
          retention-days: 7

  jar:
    needs: natives
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-x86_64
          workspaces: |
            . -> target
            bindings -> target
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jvm-native-*
          path: natives
          merge-multiple: true
      - name: The JAR with every platform's library, tested
        run: |
          ls -R natives
          cargo xtask package-jvm --desktop --natives natives --test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-jar
          path: target/jvm/teigeodata-*.jar
          if-no-files-found: error
          retention-days: 14

  android:
    strategy:
      fail-fast: false
      matrix:
        # The minSdk, so nothing newer creeps into the library or its Java (D-288), and a
        # current release.
        api: [24, 35]
    name: android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          workspaces: |
            . -> target
            bindings -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: The AAR (NDK r30, 16 KB checked)
        run: |
          # The image's default NDK is r27, which does not align to 16 KB by default.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          cargo xtask package-jvm --android
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Parity on an emulator (x86_64)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cargo xtask package-jvm --android-test
      - if: ${{ matrix.api == 35 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teigeodata-aar
          path: target/jvm/teigeodata-*.aar
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [jar, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: teigeodata-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ./dist/teigeodata-* --clobber --repo "$GITHUB_REPOSITORY"
