# The fuzzing campaign (phase 8.1, D-331, docs/06-engineering/ci.md): every libFuzzer target for
# hours, each in its own job on GitHub's runners (free on a public repository; nothing runs on a
# maintainer's machine), then the coverage gate: every section kind's decoder reached by at least
# one target. Weekly, after the nightly run has finished, and by dispatch.
name: fuzz-campaign

on:
  schedule:
    - cron: "13 6 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (3 h by default; at most 5 h, the job limit is 6 h)
        default: "10800"

permissions:
  contents: read

concurrency:
  group: fuzz-campaign
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The corpus cache is the nightly's (same key prefix): the campaign starts from the newest
  # corpus either workflow saved and saves its own, minimised, for the next nightly. A crash
  # fails the job and uploads its input; it becomes a `found_by_libfuzzer` regression in the
  # crate's `tests/fuzz.rs`.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TARGET: x86_64-unknown-linux-gnu
      SECONDS_PER_TARGET: ${{ inputs.seconds || '10800' }}
    strategy:
      fail-fast: false
      matrix:
        target: [open, round_trip, mutate, manifest, sections, bitpack, table, bits, transport_table, transport_asset, transport_frame, server_query, engine, trust, ffi, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound the run
        # The job limit is 6 h; fuzzing, minimising and the coverage replay must fit inside.
        run: |
          case "$SECONDS_PER_TARGET" in ''|*[!0-9]*) echo "seconds must be a number"; exit 1;; esac
          if [ "$SECONDS_PER_TARGET" -gt 18000 ]; then echo "at most 18000 s (5 h)"; exit 1; fi
      - name: Nightly toolchain, llvm-tools and cargo-fuzz
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: campaign-${{ matrix.target }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and defaults to its own build target, where
        # the sanitizers cannot link: name the host target. Same limits as the nightly.
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run --target "$TARGET" ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=4096 -rss_limit_mb=2048 \
            -timeout=10 -print_final_stats=1 2>&1 | tee fuzz.log
          exit "${PIPESTATUS[0]}"
      - name: Minimise the corpus
        working-directory: fuzz
        run: cargo +nightly fuzz cmin --target "$TARGET" ${{ matrix.target }} corpus/${{ matrix.target }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Coverage
        # The minimised corpus replayed under source-based coverage; the summary feeds the
        # gate, the text report is for reading which lines no input reached.
        working-directory: fuzz
        run: |
          cargo +nightly fuzz coverage --target "$TARGET" ${{ matrix.target }} corpus/${{ matrix.target }}
          COV="$(rustc +nightly --print sysroot)/lib/rustlib/$TARGET/bin/llvm-cov"
          # The first triple of the path is cargo-fuzz's own (a musl build), not the target's.
          BIN="$(find target -path "*/coverage/$TARGET/release/${{ matrix.target }}" -type f | head -1)"
          if [ -z "$BIN" ]; then echo "no coverage binary for ${{ matrix.target }}"; exit 1; fi
          PROF="coverage/${{ matrix.target }}/coverage.profdata"
          mkdir -p report
          "$COV" export -summary-only -instr-profile="$PROF" "$BIN" > "report/${{ matrix.target }}.json"
          "$COV" report -instr-profile="$PROF" "$BIN" \
            -ignore-filename-regex='/\.cargo/|/rustc/|fuzz_targets/' > "report/${{ matrix.target }}.txt"
          tail -1 "report/${{ matrix.target }}.txt"
          grep -E '^stat::|^#[0-9]+ +DONE' fuzz.log | tail -8 > "report/${{ matrix.target }}.stats" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage-${{ matrix.target }}
          path: fuzz/report/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Every section kind's decoder reached by some target (`cargo xtask fuzz-coverage`). Runs
  # when a target crashed too, so the report of the others is still written; a crashed target
  # has no summary, and the decoders only it reached then fail the gate as well.
  gate:
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-coverage-*
          path: coverage
          merge-multiple: true
      - name: Decoders reached
        # The report goes to the job summary whether the gate passes or not.
        run: |
          status=0
          mkdir -p coverage
          cargo xtask fuzz-coverage coverage > coverage/report.md 2>&1 || status=$?
          cat coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-campaign-report
          path: coverage/
