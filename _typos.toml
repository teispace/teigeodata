[default]
extend-ignore-re = [
  # Devanagari and transliterated place names are not English words.
  "[\\u0900-\\u097F]+",
  # The Unicode general category Nd (decimal digit).
  "general category `Nd`",
  # ISO 3166-2 subdivision codes (NP-BA, IN-UT).
  "\\b[A-Z]{2}-[A-Z0-9]{1,3}\\b",
  # Fumadocs' element IDs (`#nd-nav`).
  "#nd-[a-z-]+",
  # OpenPGP key fingerprints (ten groups of four hex digits).
  "\\b(?:[0-9A-F]{4} ){9}[0-9A-F]{4}\\b",
]

[default.extend-words]
# wrk, the HTTP load generator (server-load research).
wrk = "wrk"
# IST, India Standard Time (tzdb abbreviation).
ist = "ist"
# CLDR subdivision code of Uttarakhand (IN-UT).
inut = "inut"
# Alo, a kingdom of Wallis and Futuna (Natural Earth admin 1).
alo = "alo"
# "Flor", a typed prefix of Florida in the world golden set.
flor = "flor"
# Nepali and Indian place-name terms.
tole = "tole"
chowk = "chowk"
khola = "khola"
danda = "danda"
bhanjyang = "bhanjyang"
palika = "palika"
# Darma Rural Municipality, Salyan (COD-AB name, Nepal postal codes).
darma = "darma"
# A simulator's unique device ID (simctl's JSON field) and the macOS wheel repair tool.
udid = "udid"
delocate = "delocate"
# Level of detail (boundary geometry).
lod = "lod"
# ISO 15924 script codes.
beng = "beng"
# Names of people and organisations cited in research.
beling = "beling"
linz = "linz"
alos = "alos"
gir = "gir"
iit = "iit"
# Crate names and a cited French title (Weiszfeld 1937).
flate = "flate"
sur = "sur"
somme = "somme"
# A source's own spelling, quoted on purpose (CBS local-level list).
metropolitian = "metropolitian"
# SlideRule's API field name for request parameters (`{"parms": …}`).
parms = "parms"
# The bitap (shift-and) string-matching algorithm.
bitap = "bitap"

[files]
extend-exclude = [
  # Licence and conduct texts are copied verbatim.
  "LICENSE",
  "DCO",
  "CODE_OF_CONDUCT.md",
  # Generated from the pack: ISO 3166 codes and source names (`cargo xtask data-pages`).
  "site/content/docs/data/coverage.mdx",
  "site/content/docs/data/countries/*.mdx",
  # Gate records and the page made from them: commit hashes (`--record`, `cargo xtask data-pages`).
  "site/data/measured/*.json",
  "site/content/docs/data/measured.mdx",
]
