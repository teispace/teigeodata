[package]
name = "xtask"
description = "Every repository task and gate of teigeodata (ADR-0021)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
teigeodata-core.workspace = true
teigeodata-format = { workspace = true, features = ["write"] }
teigeodata-names = { workspace = true, features = ["serde"] }
teigeodata-sync = { workspace = true, features = ["http", "repo", "write"] }
# Ed25519 keys of the catalog repository (xtask tuf, D-163).
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
minijinja = { version = "3.0.5", default-features = false, features = ["builtins", "macros", "serde"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing"] }
toml = "1.2.1"
unicode-normalization = "0.1.26"
unicode-script = "0.5.9"
# C zstd at level 19, as releases compress the transport asset (check-pack's wire sizes).
zstd = { version = "0.14.3", default-features = false }

[lints]
workspace = true
