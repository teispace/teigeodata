# The forge: teigeodata's data pipeline (ADR-0035). A separate workspace so that its heavy
# dependencies (HTTP, Parquet, OSM, raster decoders) never reach the runtime crates (ADR-0001).
# The toolchain comes from the repository's rust-toolchain.toml. Lints match the main
# workspace; keep the two tables in step.
[workspace]
resolver = "3"
members = ["crates/forge"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/teispace/teigeodata"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Iteration builds (D-108): optimised like release, but without LTO and with parallel,
# incremental codegen, so a one-file change relinks in seconds. Published numbers come from
# `release`; `forge make` caches the same with either, since stage keys hash sources.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
