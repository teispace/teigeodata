[package]
name = "teigeodata-forge"
description = "The teigeodata data pipeline: fetch, read, conflate, fix and pack (ADR-0035)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1.12.1"
osmpbf = "0.3.8"
rayon = "1.12.0"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
teigeodata-names = { version = "0.0.0", path = "../../../crates/teigeodata-names", features = ["serde"] }
teigeodata-core = { version = "0.0.0", path = "../../../crates/teigeodata-core", features = ["alloc"] }
teigeodata-format = { version = "0.0.0", path = "../../../crates/teigeodata-format", features = ["write", "signature", "spatial"] }
blake3 = { version = "1.8.7", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = "0.11.1"
toml = "1.2.1"
ureq = "3.5.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[build-dependencies]
blake3 = { version = "1.8.7", default-features = false }

[lints]
workspace = true
