[package]
name = "teigeodata-sync"
description = "Downloads, updates and storage of teigeodata packs: the seekable zstd transport, its seek-table reader and frame planner."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Frame decoding with `ruzstd` (pure Rust, the decoder the reader already has, D-079).
zstd = ["dep:ruzstd"]
# The transport writer: release tooling and tests. The compressor is the caller's (the forge
# uses C zstd); the self-check decodes with `ruzstd`, the client's decoder.
write = ["zstd", "teigeodata-format/write"]
# The catalog: its trust chain, a TUF 1.0 client for the four top-level roles (D-159), and its
# pack details, schema v1 (D-160).
trust = ["dep:ed25519-dalek", "dep:serde_json", "dep:sha2", "dep:blake3", "dep:teigeodata-core"]
# The repository side: writes and signs the roles the client verifies (D-162).
repo = ["trust"]
# The sans-I/O installer: a pack from its transport asset by range requests, checked against
# the signed catalog before any byte is written (D-167).
install = ["trust", "zstd"]
# The standard library: files and sockets, for the drivers below.
std = []
# The driver over a `Transport` into a staging file (D-168).
fetch = ["install", "std"]
# The default transport: `ureq` with rustls and the platform's trust store (D-168), and gzip
# for the catalog's metadata (D-179).
http = ["fetch", "dep:ureq", "ureq/gzip"]
# The installed packs on disk: staging, the atomic install, the journal and recovery (D-171),
# and the catalog refresh that keeps the verified metadata beside them (D-178). Sections a
# partial install leaves out are punched out of the file (D-189): `libc` or `windows-sys`.
store = ["fetch", "dep:libc", "dep:windows-sys"]
# The store's client: the policy over one store directory, shared by the command line and
# every binding (research note store-api).
client = ["store", "http"]
# The fuzz and property harnesses, shared by `cargo test` and cargo-fuzz (D-072).
fuzz = ["write"]

[dependencies]
blake3 = { version = "1.8.7", default-features = false, optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.11.1", default-features = false, optional = true }
ruzstd = { version = "0.9.1", default-features = false, optional = true }
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
teigeodata-core = { workspace = true, optional = true }
teigeodata-format.workspace = true

# Hole punching for partial installs (D-189), in `holes.rs` only.
[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = { version = "0.2.191", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
teigeodata-sync = { path = ".", features = ["fuzz", "install", "repo", "trust", "store", "write"] }
# C zstd at the levels the forge uses, and the seekable-format oracle over the same C library.
zeekstd = { version = "0.6.3", default-features = false, features = ["std"] }
zstd = { version = "0.14.3", default-features = false }

# The workspace lints with `unsafe_code` lowered from forbid to deny, as for the boundary
# crates (D-067): freeing a file's blocks is a system call with no safe wrapper on Apple
# platforms, and `holes.rs` is the one module allowed to make it, with a reason (D-189).
# `cargo xtask check-workspace` keeps this table equal to the workspace's in every other entry.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
allow_attributes_without_reason = "warn"
