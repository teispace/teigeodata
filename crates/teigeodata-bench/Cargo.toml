[package]
name = "teigeodata-bench"
description = "Benchmark workloads of teigeodata: defined once, run by every harness (docs/06-engineering/benchmarks.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
teigeodata-core = { workspace = true, features = ["alloc"] }
teigeodata-format = { workspace = true, features = ["write", "signature"] }

[dev-dependencies]
# The B1 rival (tantivy's bit-packer).
bitpacking = "0.9.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[[bench]]
name = "format"
harness = false

[[bench]]
name = "b1"
harness = false

[lints]
workspace = true
