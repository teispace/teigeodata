[package]
name = "teigeodata-bench"
description = "Benchmark workloads of teigeodata: defined once, run by every harness (docs/06-engineering/benchmarks.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
teigeodata-core = { workspace = true, features = ["alloc"] }
teigeodata-format = { workspace = true, features = ["write", "signature", "zstd", "spatial"] }

[dev-dependencies]
# The B1 rival (tantivy's bit-packer).
bitpacking = "0.9.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The forge's BLOBS compressor, for B4.
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder"] }
# B8 rivals: flatbush with f64 boxes, and an in-memory R*-tree.
geo-index = "0.4.0"
rstar = "0.14.0"
# B9: the world timezones (GeoJSON) and the rival, tzf-rs with its full data loaded from a file.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tzf-rs = { version = "=2.3.0", default-features = false }
# Instruction counts under Callgrind (the `counts` bench; it runs on Linux, with Valgrind).
gungraun = "0.20.0"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "format"
harness = false

[[bench]]
name = "b1"
harness = false

[[bench]]
name = "counts"
harness = false

[lints]
workspace = true
