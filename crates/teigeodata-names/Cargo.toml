[package]
name = "teigeodata-names"
description = "Name normalisation and phonetic keys for teigeodata: one code path for the forge and the runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
unicode-normalization = { version = "0.1.26", default-features = false }
unicode-script = { version = "0.5.9", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"], optional = true }

[features]
# Deserialize romanisation profiles (`romanise::ProfileData`) from their data files.
serde = ["dep:serde"]

[lints]
workspace = true
