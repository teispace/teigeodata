[package]
name = "teigeodata-engine"
description = "The layered engine of teigeodata: open packs mapped, verify them lazily, and answer queries across every installed pack as one dataset."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = [
    "mmap",
    "shared",
    "elevation",
    "admin",
    "names",
    "search",
    "timezone",
    "timezone-index",
    "boundaries",
    "admin-index",
    "dem",
    "tz-rules",
    "postal",
    "substring",
]
# One feature per component (D-133, D-135, D-136): a build without one carries none of its
# readers or queries, and a pack's sections of it are treated as not installed. `point` (IDs,
# places, the spatial index) is always built.
elevation = []
admin = []
names = []
search = ["names", "dep:teigeodata-names", "dep:libm"]
timezone = []
timezone-index = []
boundaries = []
admin-index = ["boundaries"]
# Terrain heights at any point from a pack's DEM (D-089, D-192): `Engine::elevation_at`.
dem = []
# Zone rules (D-196): offsets at an instant, the offsets of a civil time, the tzdb release.
tz-rules = []
# Postal codes (D-090, D-200): a code to its places, autocomplete, a place's codes and a point's.
postal = []
# Substring search (D-199): `search` also finds a name from 3 or more code points inside a word,
# where a layer has the `substring` component. On by default: it adds a few hundred bytes of
# code over `search` (the same reader), and the megabytes are the component's, which a client
# installs only when it wants them.
substring = ["search"]
# Indexes built on the device instead of downloaded (D-213): `derive::substring`, and with
# `store` `derive::derive_installed`. Off by default: it adds the section writer.
derive = ["substring", "teigeodata-format/write"]
# Discovery (D-164): the engine as the catalog's `Resolver` (`teigeodata_sync::catalog`), a name
# to places and the countries whose packs hold them. Off by default: it adds the catalog reader.
catalog = ["search", "admin-index", "dep:teigeodata-sync"]
# `Shared`: publish a new set of packs while queries run on the old one, lock-free for readers
# (`arc-swap`, D-141).
shared = ["dep:arc-swap"]
# The snapshot swap over the installed packs (D-172): `Shared::follow` opens what the store's
# journal lists and drops what it no longer does, in one publish.
store = ["shared", "dep:teigeodata-sync", "teigeodata-sync/store"]
# Map pack files with `memmap2` (native targets only; WASM reads packs into memory). The one
# module that uses `unsafe` is `map.rs` (D-113).
mmap = ["dep:memmap2"]
# Embed the baseline pack (`BASELINE`, `Engine::with_baseline`): the file at the absolute path in
# `TEIGEODATA_BASELINE`, built by `forge embed`. Off by default: it adds the file's size.
baseline = []

[dependencies]
teigeodata-core.workspace = true
teigeodata-format = { workspace = true, features = ["spatial", "alloc"] }
teigeodata-names = { workspace = true, optional = true }
teigeodata-sync = { workspace = true, features = ["trust"], optional = true }
arc-swap = { version = "1.9.4", optional = true }
# The focus decay of search (D-226): the same result on every platform, as `spatial`.
libm = { version = "0.2.16", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { version = "0.9.12", optional = true }

[dev-dependencies]
teigeodata-format = { workspace = true, features = ["write", "spatial"] }
teigeodata-names.workspace = true
arc-swap = "1.9.4"

# The tests and the example that use every query need every component's feature; `built`
# runs under any set of features.
[[test]]
name = "alloc"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

[[test]]
name = "components"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

[[test]]
name = "metamorphic"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

[[test]]
name = "extract"
required-features = ["elevation", "admin", "names", "search", "admin-index"]

[[test]]
name = "baseline"
required-features = ["baseline", "admin", "names", "search", "timezone", "admin-index"]

[[test]]
name = "world"
required-features = ["admin", "names", "search", "admin-index", "catalog"]

[[test]]
name = "queries"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

[[test]]
name = "discover"
required-features = ["catalog", "names"]

[[test]]
name = "outline"
required-features = ["boundaries"]

[[test]]
name = "dem"
required-features = ["dem"]

[[test]]
name = "iso"
required-features = ["admin"]

[[test]]
name = "names"
required-features = ["names"]

[[test]]
name = "substring"
required-features = ["substring"]

[[test]]
name = "tz_rules"
required-features = ["tz-rules", "timezone-index"]

[[test]]
name = "postal"
required-features = ["postal", "admin-index"]

[[test]]
name = "shared"
required-features = ["shared"]

[[test]]
name = "follow"
required-features = ["store"]

[[test]]
name = "verify"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

[[example]]
name = "substring"
required-features = ["substring"]

[[example]]
name = "snapshot-ab"
required-features = ["shared"]

[[example]]
name = "measure"
required-features = ["elevation", "admin", "names", "search", "timezone", "timezone-index", "admin-index"]

# The workspace lints with `unsafe_code` lowered from forbid to deny, as for the boundary
# crates (D-067): mapping a file is `unsafe` in Rust, and `map.rs` is the one module allowed to
# do it, with a reason (D-113). `cargo xtask check-workspace` keeps this table equal to the
# workspace's in every other entry.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
allow_attributes_without_reason = "warn"
