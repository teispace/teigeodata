[package]
name = "teigeodata-api"
description = "The safe public API of teigeodata: the one source every language binding is generated from."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true
keywords.workspace = true
categories.workspace = true

[dependencies]
teigeodata-blob.workspace = true
teigeodata-core.workspace = true
teigeodata-engine = { workspace = true, default-features = false, features = ["mmap", "shared"] }
teigeodata-format.workspace = true
teigeodata-names.workspace = true
teigeodata-sync = { workspace = true, features = ["client"], optional = true }

[features]
default = ["store", "components"]
# One feature per pack component (D-137, D-291), all in `components`. A build without one keeps
# every function and answers as a layer installed without the component does: null columns,
# no postal rows, `MissingComponent` from a query that needs it. `point` is always built; the
# store needs `search` and `admin-index` for discovery, so a build with `store` has them.
components = [
    "elevation",
    "admin",
    "names",
    "search",
    "timezone",
    "timezone-index",
    "boundaries",
    "admin-index",
    "dem",
    "dem-coarse",
    "tz-rules",
    "postal",
    "substring",
    "extra",
]
elevation = ["teigeodata-engine/elevation"]
admin = ["teigeodata-engine/admin"]
names = ["teigeodata-engine/names"]
search = ["teigeodata-engine/search"]
timezone = ["teigeodata-engine/timezone"]
timezone-index = ["teigeodata-engine/timezone-index"]
boundaries = ["teigeodata-engine/boundaries"]
admin-index = ["teigeodata-engine/admin-index"]
dem = ["teigeodata-engine/dem"]
dem-coarse = ["teigeodata-engine/dem-coarse"]
tz-rules = ["teigeodata-engine/tz-rules"]
postal = ["teigeodata-engine/postal"]
substring = ["teigeodata-engine/substring"]
extra = ["teigeodata-engine/extra"]

# The store (`Store`, `Job`): the signed catalog, installs over HTTPS and the journal. Its
# HTTP and TLS stack is most of the library's size: the C ABI is 949,456 B (467 KB gzipped)
# without it and 3,123,168 B (1.64 MB gzipped) with it (`dist` profile, aarch64-apple-darwin,
# 2026-11-14, D-279). An app that only reads the packs it ships leaves it out.
store = ["dep:teigeodata-sync", "teigeodata-engine/catalog"]

[dev-dependencies]
serde_json = "1.0.154"
# The engine's test packs (`tests/engine.rs` includes its `tests/common`).
teigeodata-format = { workspace = true, features = ["write", "spatial"] }
# A repository written as a release writes it, for the store's tests (`tests/store.rs`
# includes `teigeodata-sync/tests/support`).
ed25519-dalek = { version = "3.0.0", default-features = false }
teigeodata-sync = { workspace = true, features = ["client", "repo", "write"] }
zstd = { version = "0.14.3", default-features = false }

[lints]
workspace = true

# The docs site's Rust tour (site/examples/rust), run by `cargo xtask docs-examples`.
[[example]]
name = "tour"
path = "../../site/examples/rust/tour.rs"
required-features = ["components"]
