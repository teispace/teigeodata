[package]
name = "teigeodata-server"
description = "The request core of the teigeodata servers: outputs (native, GeoJSON, Nominatim-compatible), query bounds, attribution and the seams a hosted tier plugs into."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
teigeodata-core.workspace = true
teigeodata-engine = { workspace = true, features = ["store"] }
teigeodata-sync = { workspace = true, features = ["store"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The routes' query strings (`params`, shared with the fuzz harness).
form_urlencoded = { version = "1.2.2", optional = true }
# The HTTP server (feature `http`, D-309).
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "query"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync"], optional = true }
tower-http = { version = "0.7.1", features = ["catch-panic", "cors"], optional = true }
# The accept loop: hyper's connection bounds (header timeout, HTTP/2 pings and streams) that
# `axum::serve` does not expose, and the requests-in-flight cap (server limits note, D-334).
# All three are axum's own dependencies already.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.21", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["limit", "load-shed", "timeout", "util"], optional = true }
# The MCP server (feature `mcp`): the official Rust SDK, pinned exactly (weekly releases; an
# update is reviewed against its changelog, servers note §7).
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"], optional = true }
# MCP's signed cursors: a keyed BLAKE3 hash under a key drawn at start.
blake3 = { version = "1.8.7", default-features = false, optional = true }
getrandom = { version = "0.4.3", optional = true }

[features]
# The HTTP server over axum: `http::router` and `http::serve`.
# With `mcp` too, the MCP server answers at `/mcp` (stateless Streamable HTTP).
http = ["dep:axum", "dep:form_urlencoded", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tower", "dep:tower-http", "rmcp?/transport-streamable-http-server"]
# The fuzz harness of the query parsing (`fuzz::query_string`).
fuzz = ["dep:form_urlencoded"]
# The MCP server over rmcp: `mcp::Mcp` and `mcp::serve_stdio` (phase 6.3, D-315).
mcp = ["dep:rmcp", "dep:tokio", "dep:blake3", "dep:getrandom"]
# The store's catalog: `coverage` and the catalog rows (D-318), and with `mcp` the `install`
# tool. Brings the store's client (`ureq` over rustls), which `tgd` has already.
store = ["teigeodata-sync/client"]

[dev-dependencies]
# The engine's test model (`../teigeodata-engine/tests/common`) writes its packs.
teigeodata-format = { workspace = true, features = ["write", "spatial"] }
teigeodata-names.workspace = true
# The HTTP tests drive the router in process.
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# The store tests: a signed repository written as a release writes it, served on localhost
# (`../teigeodata-sync/tests/support/repo.rs`).
teigeodata-sync = { workspace = true, features = ["repo", "write"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
zstd = { version = "0.14.3", default-features = false }

[[test]]
name = "store"
required-features = ["http", "mcp", "store"]

[[test]]
name = "fuzz"
required-features = ["fuzz"]

[[test]]
name = "http"
required-features = ["http"]

[[test]]
name = "mcp"
required-features = ["mcp"]

[[test]]
name = "mcp_http"
required-features = ["http", "mcp"]

[[test]]
name = "nominatim"
required-features = ["http"]

[lints]
workspace = true

[[test]]
name = "reference"
required-features = ["http", "mcp", "store"]

[[test]]
name = "limits"
required-features = ["http", "mcp"]
