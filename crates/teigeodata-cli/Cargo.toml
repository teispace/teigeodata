[package]
name = "teigeodata-cli"
description = "tgd, the teigeodata command line: inspect, verify, diff, extract and export packs; query them; keep a store of them in sync."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true
keywords.workspace = true
categories = ["science::geo", "command-line-utilities"]
readme = "README.md"

[features]
default = ["serve", "mcp"]
# `tgd serve`, the HTTP server (phase 6.2); its size is measured in phase 6.4.
serve = ["teigeodata-server/http", "dep:tokio"]
# `tgd mcp`, the MCP server on stdio (phase 6.3); its size is measured in phase 6.4.
mcp = ["teigeodata-server/mcp", "dep:tokio"]

[[bin]]
name = "tgd"
path = "src/main.rs"

[dependencies]
teigeodata-core.workspace = true
# `catalog`: the engine as the catalog's resolver for `find` (D-164).
teigeodata-engine = { workspace = true, features = ["catalog"] }
# The store, the catalog refresh and the default transport (D-168, D-171, D-179).
teigeodata-sync = { workspace = true, features = ["client"] }
# The writer for `extract`, BLOBS decoding and signatures for `verify`.
teigeodata-format = { workspace = true, features = ["write", "zstd", "signature"] }
# The request core, shared with the servers (ADR-0038, phase 6); its HTTP server for `serve`.
teigeodata-server = { workspace = true, features = ["store"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal"], optional = true }
# clap derive (D-178): help, suggestions, uniform usage errors and completions.
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
ed25519-dalek = { version = "3.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
teigeodata-names.workspace = true
# A repository written as a release writes it: the asset, its catalog entry, the signed roles.
teigeodata-sync = { workspace = true, features = ["http", "store", "repo", "write"] }
zstd = { version = "0.14.3", default-features = false }

[lints]
workspace = true
