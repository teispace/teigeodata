[package]
name = "teigeodata-format"
description = "The .tgd pack container of teigeodata: a validating zero-copy reader, and a deterministic writer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The writer: the forge and tests. Needs `alloc`; the reader does not.
write = ["teigeodata-core/alloc"]
# Ed25519 pack signatures: verification, and signing with `write`.
signature = ["dep:ed25519-dalek"]
# BLOBS decoding with `ruzstd` (pure Rust; allocates; internal `unsafe` accepted, D-079).
zstd = ["dep:ruzstd"]
# The fuzz and property harnesses, shared by `cargo test` and cargo-fuzz (D-072).
# Nearest-place queries: haversine with pure-Rust `libm`, the same result on every platform.
spatial = ["dep:libm"]
fuzz = ["write", "signature", "zstd", "spatial"]

[dependencies]
blake3 = { version = "1.8.7", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
libm = { version = "0.2.16", default-features = false, optional = true }
ruzstd = { version = "0.9.1", default-features = false, optional = true }
teigeodata-core.workspace = true
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }

[dev-dependencies]
# Unit and integration tests see the writer, signatures and harnesses without extra flags.
teigeodata-format = { path = ".", features = ["fuzz"] }
# C zstd, as the forge compresses BLOBS: dictionaries and level 19 (`ruzstd` encodes neither).
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
