# An app-sized layer (TG-26, D-362): what a calendar or weather app needs offline, opened from
# bytes or installed from the catalog. Nepal in full with its boundaries, so `admin_at` answers
# down to the ward; the world's countries, first-level units and cities of 5,000 or more by
# point, without boundaries; names in Nepali, English, Hindi and Sanskrit.
about: >-
  An app-sized layer: Nepal in full with boundaries down to the ward, the world's countries,
  first-level units and cities of 5,000 or more, named in Nepali, English, Hindi and Sanskrit.
build: lite
components: [point, elevation, admin, names, search, timezone, tz-rules, boundaries, admin-index]
# Nepali, Hindi and Sanskrit in Devanagari only: GeoNames tags romanisations `ne` (D-215).
languages: [ne-Deva, en, hi-Deva, sa-Deva]
world: geonames-cities5000
world_alternates: geonames-alternate-names
world_aliases: [wikidata-aliases-en]
world_labels: [cldr-49-ne, wikidata-labels-ne, wikidata-labels-hi]
world_towns: [in]
# The world part answers by point; `admin_at` abroad needs its boundaries back
# (`world_tolerance_m` instead of `world_outlines: none`).
world_outlines: none
countries:
  np: { rows: all, tolerance_m: 20 }
wire_kb: 10000
