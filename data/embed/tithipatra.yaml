# Tithipatra's tier 1 (addendum 1, TG-12, D-213): offline from the first launch.
# Grows as TG-13 (cities of 5,000), TG-14 (Nepali names everywhere), TG-15 (India's towns) and
# TG-16 (measured tolerance) land.
about: >-
  Tithipatra's offline-first layer: the world's countries, first-level units and cities, and
  Nepal in full, named in Nepali and English, with heights, zones, admin units and search.
build: lite
# No timezone-index: tz_at answers by the zone of the deepest unit at the point, equal to Nepal's
# pack within the 20 m tolerance (D-245, gate G-tz-layer).
# tz-rules: every zone's UTC offsets and transitions, compiled from the pinned tzdb (D-224).
components: [point, elevation, dem-coarse, admin, names, search, timezone, tz-rules, boundaries, admin-index]
# Nepali in Devanagari only: GeoNames tags Survey Department romanisations `ne` (D-215);
# Hindi in Devanagari where no Nepali name exists (D-221).
languages: [ne-Deva, hi-Deva, en]
# Every city of 5,000 or more (TG-13), each with a height and its source.
world: geonames-cities5000
# Their English alternate names, current, historical and colloquial (Bombay, Madras, Benares;
# D-265).
world_alternates: geonames-alternate-names
# Countries by CLDR's Nepali territory names (D-257), then Nepali labels from Wikidata, then
# Hindi ones (tagged hi) where Wikidata has no Nepali (D-221).
world_labels: [cldr-49-ne, wikidata-labels-ne, wikidata-labels-hi]
# India's districts and statutory towns, each placed by name within its district (D-259).
world_towns: [in]
countries:
  np: { rows: all, tolerance_m: 20 }
wire_kb: 15000
