# Pinned data sources (AGENTS.md §5, ADR-0035), schema teigeodata/sources/v1.
#
# Every byte a build or spike reads is listed here with its licence class (CLEAN_ROOM.md rule 1)
# and pinned by SHA-256 and size. `forge fetch` downloads into data/cache/store/sha256/ and keeps
# only matching bytes; `forge fetch --pin <id>` records new bytes deliberately. `moving = true`
# marks an upstream that replaces files in place (no dated archive): such a source needs a
# mirror_url (our release asset) before a release build reads it. `cargo xtask check-data`
# validates this file.

schema = "teigeodata/sources/v1"

