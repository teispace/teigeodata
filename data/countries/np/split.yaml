# How `forge make np --split` cuts Nepal into one pack per province (split builds, D-191).
# Schema: teigeodata/split/v1. Each unit of `level` with an ISO 3166-2 code in iso3166.yaml gets
# the pack address `<cc>-<code>` (lowercased, the country prefix dropped: NP-P3 → np-p3); the
# codes and their source live there (one fact, one home, D-197). A split at a level ISO does
# not code lists `source` and `units` (key → address part) here instead.
# Nepal ships whole; the split is the forge's gate on real data until a country needs it.
schema: teigeodata/split/v1
level: 1
