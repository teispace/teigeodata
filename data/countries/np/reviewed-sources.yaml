# The licence class of each source a name reviewer cites (D-359), read by
# `forge reviewed-import`; a source no prefix covers is refused, so each is classified once by a
# person. Classes as in CLEAN_ROOM.md: lite reads attribution-only classes, main also ODbL,
# neither share-alike. `official`: the source is an official list, so an English spelling it
# gives may replace the canonical name. `credit`: the notice a pack carries when a name from the
# source is applied, required for every class but public domain and CC0 (D-360).
schema: teigeodata/reviewed-sources/v1

# The reviewer's own reading. The review is Teispace's work, contributed under CC0.
judgement: cc0

sources:
  # Open Data Nepal's records of the CBS code lists: "Creative Commons Attribution" (as the
  # pinned cbs-np-local-levels and cbs-np-districts in sources.lock).
  - prefix: "https://opendatanepal.com/"
    class: cc-by
    official: true
    credit: "Central Bureau of Statistics (now National Statistics Office), Nepal, via Open Data Nepal (https://opendatanepal.com), Creative Commons Attribution"
  # The Election Commission's 2079 lookups: a Government of Nepal work (Copyright Act 2059,
  # section 40) with no open licence stated, admitted by the maintainer, credited (D-360).
  - prefix: "https://result.election.gov.np/"
    class: government
    official: true
    credit: "Election Commission of Nepal, local elections 2079 (https://result.election.gov.np)"
  # The Constitution's text (Schedule 4, the districts), admitted as above (D-360).
  - prefix: "Constitution of Nepal"
    class: government
    official: true
    credit: "Constitution of Nepal 2072 (2015), Government of Nepal"
  # MIT, but "collected from wikipedia and various Nepal government sites" (its README,
  # 2026-11-16): an attribution-only source built from share-alike data is share-alike
  # (CLEAN_ROOM.md rule 6), refused by both builds (ADR-0030).
  - prefix: "https://github.com/sagautam5/local-states-nepal"
    class: share-alike
    credit: "sagautam5/local-states-nepal (https://github.com/sagautam5/local-states-nepal)"
  # Nepali Wikipedia: CC BY-SA, refused by both builds (ADR-0030).
  - prefix: "https://ne.wikipedia.org/"
    class: share-alike
    credit: "Nepali Wikipedia (https://ne.wikipedia.org), CC BY-SA 4.0"
