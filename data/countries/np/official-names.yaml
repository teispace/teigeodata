# Official names of Nepal's units, joined by the list's own code (tier 1 of the names chain,
# nepali-names §5.1, D-232; P16: countries are data). Schema: teigeodata/official-names/v1.
# `units` is the crosswalk from each unit's key in the build (COD-AB v02 P-code) to the list's
# code, made on 2026-11-12 by joining names inside each district: 715 of the 753 local levels by
# the same name, 10 of them the same unit spelled differently (reviewed one by one, noted). Left
# out: the 38 local levels renamed after the CBS list was made, whose list name is the old one
# (Pathivara Yangwarak (Taplejung); Barahachhetra (Sunsari); Bhokraha Narsingh (Sunsari);
# Shahidbhumi (Dhankuta); Mapya Dudhkoshi (Solukhumbu); Thulung Dudhkoshi (Solukhumbu); Diktel
# Rupakot Majhuwagadhi (Khotang); Rawa Besi (Khotang); Diprung Chuichumma (Khotang); Limchunbung
# (Udayapur); Rajgadh (Saptari); Janakpurdham (Dhanusa); Likhu Tamakoshi (Ramechhap); Baiteshwor
# (Dolakha); Myagang (Nuwakot); Aamachhodingmo (Rasuwa); Netrawati Dabjong (Dhading); Barpak
# Sulikot (Gorkha); Bhimsenthapa (Gorkha); Ngisyang (Manang); Narpa Bhumi (Manang); Pokhara
# (Kaski); Lo Ghekar Damodarkunda (Mustang); Varagung Muktichhetra (Mustang); Ruruchhetra (Gulmi);
# Gangadev (Rolpa); Pariwartan (Rolpa); Sunil Smriti (Rolpa); Kumakh (Salyan); Siddha Kumakh
# (Salyan); Nalgad (Jajarkot); Shuva Kalika (Kalikot); Saipal (Bajhang); Khaptad Chhededaha
# (Bajura); Jagannath (Bajura); Swamikartik Khapar (Bajura); Bogatan Phudsil (Doti); Dodhara
# Chandani (Kanchanpur)), and the 22 protected areas, which the list does not have. Their Nepali
# names come from later tiers. Each entry states the unit's name in COD-AB v02: a later release
# that renames a unit fails the build, and the crosswalk is reviewed again.
schema: teigeodata/official-names/v1
lists:
  # The districts: CBS, via Open Data Nepal, CC BY. All 77 join by name, but the published
  # file's Nepali column is shifted from row 43 on (Nawalparasi East's name is split over two
  # lines, then Nawalparasi West's): from code 408 every row carries another district's name
  # (DANG रुपन्देही, BAJHANG सुर्खेत). Found 2026-11-12 by romanising each Nepali name against
  # its row's English (35 rows far, 0 of the 42 before); the local-level list has no such shift.
  # Only codes 101 to 407 are joined; the other 35 districts take later tiers.
  - source: cbs-np-districts
    code: Code
    name: "जिल्ला"
    lang: ne
    latin: District
