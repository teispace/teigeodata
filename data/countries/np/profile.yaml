# Country profile for Nepal (principle P16: countries are data). Schema: teigeodata/profile/v1.
# Facts: the federal structure of 2017 (7 provinces, 77 districts, 753 local levels, 6,743 wards);
# unit-type codes measured in OCHA COD-AB v02 P-codes on 2026-11-06 (counts match exactly).
schema: teigeodata/profile/v1
country: NP
iso3: NPL
name: Nepal
wikidata: Q837
# Phonetic key for matching and search (teigeodata-names): Latin and Devanagari names.
phonetic_key: indic-v0
# G-conf (D-131): the least recall of the model without IDs against the stated links, per
# source pair with 100 links or more; measured 2026-11-09: GeoNames–Wikidata 0.832,
# OSM–Wikidata 0.882. A floor against regression; the target 0.95 waits for labelled pairs.
conflation: { min_recall: 0.80 }
# Nepal Bhasa (new) is written in Devanagari and in Newa (Prachalit) script.
languages: [ne, en, new]
scripts: [Deva, Latn, Newa]
# Romanisation of names with no Latin spelling (data/romanise/; names-canonical §5.1).
romanise: [ne-Deva]
# Names in Devanagari for places with none, from the transliterator (D-222, D-228): alt names
# marked `transliteration`, never canonical.
transliterate: [ne-Latn-Deva]
# Names in Devanagari for places with no Nepali one, from related languages' labels (D-236,
# tier 4 of nepali-names §5.1), before the transliterator: a donor's label is cut of the type
# words above and below and taken only when it romanises close to the place's Latin name.
# Order and members by measured agreement with Nepali names people wrote (G-donor, D-236): a
# donor must write the Nepali name more often than the transliterator does (45.5%). Measured on
# the lite build of 2026-11-12, the same name / within one edit, places with both: Sanskrit
# 77% / 83% (87), Awadhi 75% / 86% (102), Doteli 64% / 74% (154). Left out: Maithili 46% / 61%
# (276), Marathi 36% / 71% (14), Bhojpuri 25% / 47% (138), Hindi 23% / 54% (105), and Newari
# (new), whose labels are often its own names (ख्वप for Bhaktapur), not spellings.
name_donors:
  - to: ne
    script: Deva
    from: [sa, awa, dty]
    # The donors' own type words: district in Hindi, Maithili and Bhojpuri (जिला), Marathi
    # (जिल्हा), Sanskrit (मण्डलम्, written joined), municipality words as in Nepali.
    strip: [जिला, जिल्हा, मण्डलम्, मण्डल, नगर निगम, नगरपालिका, गाँउपालिका]
    # Hindi-style spelling writes a word's final ङ as ंग or ँग (धादिंग, खोटाँग); Nepali as ङ.
    word_ends:
      - { text: "ंग", means: "ङ" }
      - { text: "ँग", means: "ङ" }
    status: accepted
    evidence:
      - { kind: usage, detail: "G-donor on the lite build of 2026-11-12 (nepali-names §5.8): each kept donor writes the Nepali name on 64% to 77% of the places with both, above the transliterator's 45.5%" }
admin_levels:
  - { level: 1, english: Province, native: [{ lang: ne, script: Deva, text: "प्रदेश" }] }
  - { level: 2, english: District, native: [{ lang: ne, script: Deva, text: "जिल्ला" }] }
  - { level: 3, english: Local level, native: [{ lang: ne, script: Deva, text: "स्थानीय तह" }] }
  - { level: 4, english: Ward, native: [{ lang: ne, script: Deva, text: "वडा" }] }
unit_types:
  - id: metropolitan_city
    level: 3
    english: Metropolitan City
    native: [{ lang: ne, script: Deva, text: "महानगरपालिका" }]
    expected_count: 6
    source_codes: { codab: "1" }
  - id: sub_metropolitan_city
    level: 3
    english: Sub-Metropolitan City
    native: [{ lang: ne, script: Deva, text: "उपमहानगरपालिका" }]
    expected_count: 11
    abbreviations: [{ text: SMC, status: proposed }]
    source_codes: { codab: "2" }
  - id: municipality
    level: 3
    english: Municipality
    native: [{ lang: ne, script: Deva, text: "नगरपालिका" }]
    expected_count: 276
    source_codes: { codab: "3" }
  - id: rural_municipality
    level: 3
    english: Rural Municipality
    native: [{ lang: ne, script: Deva, text: "गाउँपालिका" }]
    expected_count: 460
    abbreviations: [{ text: RM, status: proposed }]
    source_codes: { codab: "4" }
  - id: protected_area
    level: 3
    english: Protected area
    expected_count: 22
    source_codes: { codab: "5" }
droppable_suffixes:
  # "Janakpurdham" is commonly written "Janakpur".
  - { text: dham, status: proposed }
# Latin spelling conventions a query may use where the names use another (D-233): Nepali व is
# written "b" in most romanised names (Biratnagar, Bishnu) and "v" in others and in Hindi-style
# spellings (Viratnagar, Vishnu). A query's every "v" is also read as "b", matched as loosely as
# a difference in case, so importance and the focus point decide between such names.
latin_spellings:
  - text: v
    means: b
    status: accepted
    evidence:
      - { kind: usage, detail: "Biratnagar (CBS, COD-AB, the city) is spelled Viratnagar in Hindi-style romanisations; Bishnu/Vishnu, Birgunj/Virgunj alike" }
      - { kind: usage, detail: "Nepali व is read [b] or [w] (nepali-names §3.5); the TG-18 check of 2026-11-11 found viratnagar ranking India's Viratnagar above Biratnagar" }
  # Nepali फ is romanised "ph" in the names (Phidim, Pharping) and "f" by many who type them; two
  # edits apart, so the one-edit tier misses it (TG-18: fidim ranked Didim, Turkey, first).
  - text: f
    means: ph
    status: accepted
    evidence:
      - { kind: usage, detail: "the MVP's romanisation fold joins ph and f (Tithipatra brief addendum 1 §1.2); Phidim/Fidim, Pharping/Farping, Phaplu/Faplu" }
  # The long vowels ई and ऊ are typed "ee" and "oo" in informal romanisation, "i" and "u" in the
  # names (Birgunj, Gulmi): two edits apart.
  - text: ee
    means: i
    status: accepted
    evidence:
      - { kind: usage, detail: "the MVP's romanisation fold maps ee to i (Tithipatra brief addendum 1 §1.2); Beerganj/Birganj, Seeta/Sita" }
  - text: oo
    means: u
    status: accepted
    evidence:
      - { kind: usage, detail: "the MVP's romanisation fold maps oo to u (Tithipatra brief addendum 1 §1.2); Goolmi/Gulmi, Phoolbari/Phulbari" }
sources:
  codab: { unit_type_code: { field: adm3_pcode, offset: 6, length: 1 } }
