# How `forge make np` builds Nepal's packs (D-095). Schema: teigeodata/build/v1.
# Every source ID is pinned in data/sources.lock; the lite build reads only the sources its
# licence gate allows (CLEAN_ROOM.md rule 2).
schema: teigeodata/build/v1
# Admin units: OCHA COD-AB (levels 1 to 4).
admin: codab-np-geojson
# Timezone sources in priority order (D-138): a build takes the first its licence gate allows.
# Main: timezone-boundary-builder (ODbL). Lite: tzdb (public domain), whose zone.tab gives Nepal
# one zone, Asia/Kathmandu, over the admin-0 outline of `admin`.
timezones: [tbb-2026f, tzdb-2026f]
# Where zones overlap, these win (D-084: the Nepal perspective).
timezone_first: [Asia/Kathmandu]
# Points sources, in priority order: the first source's record gives a place its point and
# canonical name until the consensus stage (phase 3 step 3.2).
points:
  - { reader: osm, source: geofabrik-np }
  - { reader: geonames, source: geonames-np, extra: [geonames-alternate-names, geonames-hierarchy] }
  - { reader: wikidata, source: wikidata-np }
# The country's extent with a halo of at least 0.047° (about 5 km): west,south,east,north.
# COD-AB adm0 spans 80.0585–88.2018 E, 26.3474–30.4474 N (measured 2026-11-08).
extent: "80.0,26.3,88.25,30.5"
# The DEMs of place elevations (D-111), in priority order: a build takes the first its licence
# gate allows (D-132), and its tiles over the extent become a DEM section sampled at each
# place's final point. Copernicus terms are main build only (D-031); lite takes NASADEM
# (public domain, EGM96 heights moved to EGM2008).
dem: [copernicus-glo30-np, nasadem-np]
# The population grid of admin units' modelled population (D-123): WorldPop Global2 2025,
# summed over each unit; it replaces a linked record's count off by more than 1.5×. Main build
# only until its inputs are confirmed free of ODbL data (ADR-0030).
population: worldpop-np
# Building sources for the settlement core (D-091); the lite build reads only those its gate
# allows (Microsoft CDLA-Permissive 2.0, Google CC BY 4.0).
buildings:
  - { reader: osm, source: geofabrik-np }
  - { reader: msbuildings, source: msbuildings-np }
  - { reader: google, source: google-buildings-v3-np }
# G-budget (D-129): any one stage's peak resident memory and the build output (`data/build`),
# in MB, about 1.5× the measured run (2026-11-09: 964 MB peak, 609 MB of output).
budget: { rss_mb: 1500, disk_mb: 1000 }
# G-wire (D-135): what a client downloads for a component with what it needs, in kB, checked
# by `cargo xtask check-pack`. Points only (IDs, lat/lon, the spatial index): 0.55 MB (D-133).
wire_kb: { point: 550 }
