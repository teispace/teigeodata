# India's districts and statutory towns in the world part (`forge world --towns in`, TG-15,
# D-258, D-259; P16: countries are data). Schema: teigeodata/towns/v1. Every list is a pinned
# Parquet source; columns are named here, never in code.
schema: teigeodata/towns/v1
# The first level: each list code to the Wikidata item of the world part's unit it is (Natural
# Earth admin 1 carries `wikidataid`). Made 2026-11-13 by name, all 36 checked by eye; Natural
# Earth spells three differently (Jammu and Kashmir, Andaman and Nicobar, Dadra and Nagar
# Haveli and Daman and Diu) and the codes are LGD's, not ISO's.
states:
  source: lgd-in-states
  code: state_code
  units:
    "1": Q66278313  # Jammu And Kashmir (the union territory since 2019)
    "2": Q1177  # Himachal Pradesh
    "3": Q22424  # Punjab
    "4": Q43433  # Chandigarh
    "5": Q1499  # Uttarakhand
    "6": Q1174  # Haryana
    "7": Q1353  # Delhi
    "8": Q1437  # Rajasthan
    "9": Q1498  # Uttar Pradesh
    "10": Q1165  # Bihar
    "11": Q1505  # Sikkim
    "12": Q1162  # Arunachal Pradesh
    "13": Q1599  # Nagaland
    "14": Q1193  # Manipur
    "15": Q1502  # Mizoram
    "16": Q1363  # Tripura
    "17": Q1195  # Meghalaya
    "18": Q1164  # Assam
    "19": Q1356  # West Bengal
    "20": Q1184  # Jharkhand
    "21": Q22048  # Odisha
    "22": Q1168  # Chhattisgarh
    "23": Q1188  # Madhya Pradesh
    "24": Q1061  # Gujarat
    "27": Q1191  # Maharashtra
    "28": Q1159  # Andhra Pradesh
    "29": Q1185  # Karnataka
    "30": Q1171  # Goa
    "31": Q26927  # Lakshadweep
    "32": Q1186  # Kerala
    "33": Q1445  # Tamil Nadu
    "34": Q66743  # Puducherry
    "35": Q40888  # Andaman And Nicobar Islands
    "36": Q677037  # Telangana
    "37": Q200667  # Ladakh
    "38": Q77997266  # The Dadra And Nagar Haveli And Daman And Diu
# The second level, under the first by its code. A district's point is its GeoNames unit's
# (`ADM2`), found through the crosswalk (a Wikidata snapshot of code → GeoNames ID, 652 of 790
# exact, measured 2026-11-13); a district with none takes the middle of its located towns.
districts:
  source: lgd-in-districts
  code: district_code
  name: district_name
  parent: state_code
  crosswalk: wikidata-in-district-geonames
# The towns: each list row with the districts it covers (`coverage`), placed at a populated
# place of `points` found by name within its district; never guessed (india-sources §3.8).
towns:
  source: lgd-in-urban-bodies
  code: local_body_code
  name: local_body_name
  state: state_code
  coverage: { source: lgd-in-urban-coverage, code: local_body_code, district: district_code }
  # Body-type words in the list's English names, cut wherever they stand ("Municipal Council
  # Kupwara", "Jammu Municipal Corporation"); longest first.
  strip:
    - Municipal Corporation
    - Municipal Committee
    - Municipal Council
    - Municipal Board
    - Nagar Palika Parishad
    - Nagar Panchayat
    - Nagar Parishad
    - Nagar Palika
    - Nagar Nigam
    - Town Panchayat
    - Notified Area Committee
    - Notified Area Council
    - Cantonment Board
    - Town Area Committee
    - Mahanagar Palika
    - City Corporation
    - Municipality
  # Each town's name in its state's official language (LGD's own-language column, D-263),
  # taken only when it is wholly in that language's script and well formed. Languages: each
  # state's official language under its Official Language Act (Eighth Schedule names, BCP 47
  # tags with ISO 15924 scripts), checked 2026-11-13 against the scripts LGD's column holds per
  # state (Tamil 536 in Tamil Nadu, Devanagari 408 in Maharashtra, 261 in Bihar, 224 in
  # Rajasthan, Telugu 138 in Telangana, Malayalam 93 in Kerala, Gurmukhi 58 in Punjab, ...).
  # States whose column holds English copies only are listed all the same: the script check
  # refuses a copy.
  # Settlement rank (D-264): a statutory town is a town (2), a municipal corporation a city
  # (3). LGD's body types: 4 is the Municipal Corporation (all 276 checked are Nagar Nigam
  # cities: Varanasi, Lucknow, Gorakhpur, Deoghar), 21 the New Delhi Municipal Council.
  rank:
    column: local_body_type_code
    default: 2
    by_type: { "4": 3, "21": 3 }
  local:
    column: local_body_name_local
    languages:
      "2": hi-Deva  # Himachal Pradesh
      "3": pa-Guru  # Punjab
      "5": hi-Deva  # Uttarakhand
      "6": hi-Deva  # Haryana
      "7": hi-Deva  # Delhi
      "8": hi-Deva  # Rajasthan
      "9": hi-Deva  # Uttar Pradesh
      "10": hi-Deva  # Bihar
      "16": bn-Beng  # Tripura
      "19": bn-Beng  # West Bengal
      "20": hi-Deva  # Jharkhand
      "21": or-Orya  # Odisha
      "22": hi-Deva  # Chhattisgarh
      "23": hi-Deva  # Madhya Pradesh
      "24": gu-Gujr  # Gujarat
      "27": mr-Deva  # Maharashtra
      "28": te-Telu  # Andhra Pradesh
      "29": kn-Knda  # Karnataka
      "32": ml-Mlym  # Kerala
      "33": ta-Taml  # Tamil Nadu
      "36": te-Telu  # Telangana
points: geonames-in
# Gate G-town: the share of listed towns placed, at least; a floor that only rises (set at the
# first build's measured rate, D-259).
floor: 0.81
