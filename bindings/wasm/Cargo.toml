[package]
name = "teigeodata-wasm"
description = "The WebAssembly module of teigeodata; its shim is generated by `cargo xtask bindings`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

# One feature per pack component, as teigeodata-api's (D-291): a variant of the npm package is
# a set of them (`cargo xtask package-wasm`). `store` adds the browser's store (D-375): the
# store's client over the host's files (OPFS) and `fetch`, its own package variant.
[features]
default = ["components"]
components = ["teigeodata-api/components"]
elevation = ["teigeodata-api/elevation"]
admin = ["teigeodata-api/admin"]
names = ["teigeodata-api/names"]
search = ["teigeodata-api/search"]
timezone = ["teigeodata-api/timezone"]
timezone-index = ["teigeodata-api/timezone-index"]
boundaries = ["teigeodata-api/boundaries"]
admin-index = ["teigeodata-api/admin-index"]
dem = ["teigeodata-api/dem"]
dem-coarse = ["teigeodata-api/dem-coarse"]
tz-rules = ["teigeodata-api/tz-rules"]
postal = ["teigeodata-api/postal"]
substring = ["teigeodata-api/substring"]
extra = ["teigeodata-api/extra"]
store = ["teigeodata-api/store-core", "dep:teigeodata-sync", "dep:wasm-bindgen-futures"]

[dependencies]
teigeodata-api.workspace = true
# The CLI that writes the JavaScript glue must be this exact version.
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
teigeodata-sync = { workspace = true, optional = true, features = ["store"] }
wasm-bindgen-futures = { version = "=0.4.80", optional = true }

[lints]
workspace = true
