name: teigeodata
description: Accurate, offline places. The Dart binding of teigeodata over its C ABI.
version: 1.0.1
repository: https://github.com/teispace/teigeodata

environment:
  # Build hooks are stable from Dart 3.10 (Flutter 3.38).
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.8
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  # The web suite's server (test/web_server.dart) talks to the page over its channel.
  stream_channel: ^2.1.4
  test: ^1.26.0
