[package]
name = "teigeodata-jvm"
description = "The jvm binding of teigeodata; its shim is generated by `cargo xtask bindings`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = ["store"]
# The store (`Store`, `Job`) in the library; without it the HTTP and TLS stack is left out
# (teigeodata-api's `store` feature).
store = ["teigeodata-api/store"]

[dependencies]
teigeodata-api.workspace = true
jni = "0.22.4"

[lints]
workspace = true
