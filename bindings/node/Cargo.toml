[package]
name = "teigeodata-node"
description = "The node binding of teigeodata; its shim is generated by `cargo xtask bindings`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
teigeodata-api.workspace = true
napi = { version = "3.16.1", default-features = false, features = ["napi4"] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
