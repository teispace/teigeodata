[package]
name = "teigeodata-python"
description = "The python binding of teigeodata; its shim is generated by `cargo xtask bindings`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = ["store"]
# The store (`Store`, `Job`) in the module; without it the HTTP and TLS stack is left out
# (teigeodata-api's `store` feature).
store = ["teigeodata-api/store"]

[dependencies]
teigeodata-api.workspace = true
# One stable-ABI module per wheel family (D-290): built by Python 3.11 to 3.14 it is `abi3`
# (3.11 and later, GIL builds; 3.11 is the first with the buffer protocol in the limited API),
# built by 3.15 or later it is `abi3t`, which free-threaded and GIL builds both load.
pyo3 = { version = "0.30.1", features = ["abi3-py311", "abi3t-py315"] }

[lints]
workspace = true
